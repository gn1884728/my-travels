<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <link rel="manifest" href="manifest.json">
    <title>生活優惠中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto overflow-hidden">
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex flex-col items-center gap-2">
        <div class="text-xl font-bold">生活優惠中心</div>
        <div class="w-full max-w-xs text-xs font-normal text-gray-800">
            <select id="globalSkillSelect" onchange="loadSelectedSkill(this.value)" class="w-full p-2 rounded-lg border bg-white shadow-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="default">🌐 AI 模式：通用助手</option>
                <option value="japan-fireworks">🎆 AI 模式：日本花火節攻略助手</option>
                <option value="hotel-points">🏨 AI 模式：飯店點數房比價助手</option>
            </select>
        </div>
    </header>
    
    <main id="app" class="flex-1 p-4 overflow-y-auto pb-28"></main>
    
    <nav class="bg-white border-t flex justify-between p-3 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] fixed bottom-0 w-full max-w-md mx-auto z-50 text-[11px]">
        <button onclick="render('food', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-gift text-lg mb-1"></i>優惠</button>
        <button onclick="render('travel', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-plane-departure text-lg mb-1"></i>行程</button>
        <button onclick="render('lounge', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-couch text-lg mb-1"></i>貴賓室</button>
        <button onclick="render('cube_calc', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-credit-card text-lg mb-1"></i>CUBE</button>
        <button onclick="render('mileage', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-chart-line text-lg mb-1"></i>哩程</button>
        <button onclick="render('note', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-microphone-alt text-lg mb-1"></i>記事</button>
    </nav>

    <script>
        let d = { food: {}, travel: [], lounge: {} };
        let mileageData = { marriott: [] };
        let ex_twd = 32.50, ex_cny = 7.23;
        let currentSystemPrompt = "";
        let currentSkillName = "通用助手";
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwVLmSnHAsJ8DjU9ZJgp5ZZThsxbPHAtXIQ7R93O_nTd-Uz8WrkdpyFhVwwxvTEddXq/exec";
        
        async function loadSelectedSkill(skillId) {
            if (skillId === 'default') {
                currentSystemPrompt = "";
                currentSkillName = "通用助手";
                render('note');
                return;
            }
            try {
                const res = await fetch(`./skills/${skillId}.json?t=` + Date.now());
                const skillData = await res.json();
                currentSystemPrompt = skillData.systemPrompt || "";
                currentSkillName = skillData.name || skillId;
                render('note');
            } catch (e) { console.error("載入 Skill 失敗:", e); }
        }

        Promise.all([
            fetch('data.json?t='+Date.now()).then(r => r.json()).catch(() => ({ food: {}, travel: [], lounge: {} })),
            fetch('mileage_data.json?t='+Date.now()).then(r => r.json()).catch(() => ({ marriott: [] }))
        ]).then(([resData, resMileage]) => {
            d = resData || { food: {}, travel: [], lounge: {} };
            mileageData = resMileage || { marriott: [] };
            render('food');
        });

        function render(tab, ev = null) {
            const app = document.getElementById('app');
            if (!app) return;

            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-blue-600', 'font-bold');
                btn.classList.add('text-gray-600');
            });
            if (ev && ev.currentTarget) {
                ev.currentTarget.classList.add('text-blue-600', 'font-bold');
            }

            let month = new Date().getMonth() + 1;

            if(tab === 'food') {
                let options = Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${i+1==month?'selected':''}>${i+1}月份</option>`).join('');
                app.innerHTML = `<select onchange="renderFoodMonth(this.value)" class="w-full p-3 mb-4 rounded-xl border font-bold bg-white">${options}</select><div id="food-list"></div>`;
                renderFoodMonth(month);
            } else if(tab === 'travel') {
                app.innerHTML = `<h2 class="text-xl font-bold mb-3 text-center text-gray-800"><i class="fas fa-plane-departure text-blue-600 mr-2"></i>精選旅行行程</h2>`;
            } else if(tab === 'lounge') {
                let loungeKeys = d.lounge ? Object.keys(d.lounge) : [];
                app.innerHTML = `
                    <select id="c" onchange="up_city()" class="w-full p-4 border rounded-xl mb-3 font-bold bg-white"><option value="">選擇國家</option>${loungeKeys.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
                    <select id="ci" onchange="up_air()" class="w-full p-4 border rounded-xl mb-3 bg-white"><option value="">選擇城市</option></select>
                    <select id="a" onchange="up_mem()" class="w-full p-4 border rounded-xl mb-3 bg-white"><option value="">選擇機場</option></select>
                    <select id="m" onchange="show()" class="w-full p-4 border rounded-xl mb-3 bg-white"><option value="">選擇會籍</option></select>
                    <div id="r"></div>`;
            } else if(tab === 'cube_calc') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-10">
                        <h3 class="font-bold text-lg mb-3 text-gray-800 text-center"><i class="fas fa-credit-card text-blue-600 mr-2"></i>CUBE 卡權益精算</h3>
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs mb-4">
                            <b>💡 童樂匯解鎖提醒：</b>需「親子與未成年子女皆持有本行帳戶」且「持有有效 CUBE 正卡」始可切換！
                        </div>
                        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="🔍 輸入店名速查方案..." class="w-full p-3 border rounded-xl mb-3 bg-gray-50 text-sm">
                        <div id="storeResult" class="p-3 bg-blue-50 rounded-xl mb-4 text-sm font-bold text-blue-800 hidden"></div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <label class="block text-gray-500 text-xs mb-1 font-bold">消費金額</label>
                                <input type="number" id="consumeAmt" placeholder="金額" class="w-full p-3 border rounded-xl text-sm" oninput="calcPoints()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-xs mb-1 font-bold">回饋率 (%)</label>
                                <input type="number" id="consumeRate" placeholder="回饋率" class="w-full p-3 border rounded-xl text-sm" oninput="calcPoints()">
                            </div>
                        </div>
                        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-gray-50 rounded-xl">預估小樹點：0 點</div>
                    </div>`;
            } else if(tab === 'mileage') {
                app.innerHTML = `<h2 class="text-xl font-bold mb-3 text-center text-gray-800">哩程與點數試算</h2>`;
            } else if(tab === 'note') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-10">
                        <h3 class="font-bold text-lg mb-3 text-gray-800"><i class="fas fa-microphone-alt text-blue-600 mr-2"></i>AI 智慧隨手記事</h3>
                        <textarea id="noteInput" placeholder="請輸入行程/記事..." class="w-full h-32 p-3 border rounded-xl text-sm mb-3 bg-gray-50"></textarea>
                        <button onclick="sendNote()" id="submitBtn" class="bg-blue-600 text-white p-3 rounded-xl w-full font-bold text-sm shadow">送出並 AI 整理</button>
                        <div id="resultMsg" class="mt-4 text-sm text-gray-600"></div>
                    </div>`;
            }
        }

        async function searchStore() {
            const val = document.getElementById('storeSearch').value.trim().toLowerCase();
            const resDiv = document.getElementById('storeResult');
            if (!val) {
                resDiv.classList.add('hidden');
                return;
            }
            try {
                const response = await fetch('cube_config.json?t=' + Date.now());
                const data = await response.json();
                let matched = null;

                if (data.plans) {
                    for (const [planName, stores] of Object.entries(data.plans)) {
                        const found = stores.find(s => s.name.toLowerCase().includes(val));
                        if (found) {
                            matched = { plan: planName, name: found.name, rate: found.rate };
                            break;
                        }
                    }
                }

                if (matched) {
                    resDiv.classList.remove('hidden');
                    resDiv.innerHTML = `符合通路：<b>${matched.name}</b><br>推薦方案：<b>${matched.plan}</b> (回饋 ${Math.round(matched.rate * 1000) / 10}%)`;
                    document.getElementById('consumeRate').value = matched.rate * 100;
                    calcPoints();
                } else {
                    resDiv.classList.remove('hidden');
                    resDiv.innerHTML = `未找到完全符合通路，請手動確認`;
                }
            } catch(e) { 
                console.error(e); 
            }
        }

        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0;
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            // 採用無條件捨去，符合銀行實際入帳邏輯
            const points = Math.floor(amt * rate); 
            document.getElementById('pointResult').innerText = `預估小樹點：${points} 點`;
        }

        function renderFoodMonth(month) {
            const foodList = document.getElementById('food-list');
            if (!foodList) return;
            const list = (d.food && d.food[month]) || [];
            foodList.innerHTML = list.map(i => `<div class="bg-white p-5 rounded-2xl shadow mb-4"><h3 class="font-bold text-lg">${i.title}</h3><a href="${i.url}" class="text-blue-600">前往優惠</a></div>`).join('') || '<p class="text-center text-gray-400 py-4">目前尚無此月份優惠</p>';
        }

        async function sendNote() {
            const text = document.getElementById('noteInput')?.value.trim();
            const msg = document.getElementById('resultMsg');
            if (!text) { alert('請輸入內容'); return; }
            msg.innerText = "⏳ AI 處理中...";
            try {
                const response = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ text: text }) });
                const result = await response.json();
                if(result.status === "success") { msg.innerText = "✅ 成功：" + result.message; }
                else { msg.innerText = "❌ 失敗：" + result.message; }
            } catch (e) { msg.innerText = "❌ 錯誤：" + e; }
        }
    </script>
</body>
</html>
