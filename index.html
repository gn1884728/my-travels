<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>生活優惠中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto overflow-hidden">
    <header class="bg-blue-600 text-white p-5 text-xl font-bold text-center shadow-md z-10">生活優惠中心</header>
    
    <!-- 主內容區加入固定底部留白與內部捲動，避免蓋住按鈕 -->
    <main id="app" class="flex-1 p-4 overflow-y-auto pb-28"></main>
    
    <nav class="bg-white border-t flex justify-around p-4 shadow-2xl fixed bottom-0 w-full max-w-md mx-auto z-50">
        <button onclick="render('food')" class="flex flex-col items-center text-gray-600 hover:text-blue-600"><i class="fas fa-gift text-lg mb-1"></i>優惠</button>
        <button onclick="render('travel')" class="flex flex-col items-center text-gray-600 hover:text-blue-600"><i class="fas fa-plane-departure text-lg mb-1"></i>行程</button>
        <button onclick="render('lounge')" class="flex flex-col items-center text-gray-600 hover:text-blue-600"><i class="fas fa-couch text-lg mb-1"></i>貴賓室</button>
        <button onclick="render('mileage')" class="flex flex-col items-center text-gray-600 hover:text-blue-600"><i class="fas fa-chart-line text-lg mb-1"></i>航空哩程</button>
        <button onclick="render('note')" class="flex flex-col items-center text-gray-600 hover:text-blue-600"><i class="fas fa-microphone-alt text-lg mb-1"></i>記事</button>
    </nav>
    <script>
        let d = {};
        let mileageData = {};
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwVLmSnHAsJ8DjU9ZJgp5ZZThsxbPHAtXIQ7R93O_nTd-Uz8WrkdpyFhVwwxvTEddXq/exec";
        
        Promise.all([
            fetch('data.json?t='+Date.now()).then(r => r.json()),
            fetch('mileage_data.json?t='+Date.now()).then(r => r.json())
        ]).then(([resData, resMileage]) => {
            d = resData;
            mileageData = resMileage;
            render('food');
        });

        function render(tab, month = new Date().getMonth() + 1) {
            const app = document.getElementById('app');
            if(tab === 'food') {
                let options = Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${i+1==month?'selected':''}>${i+1}月份</option>`).join('');
                app.innerHTML = `<select onchange="render('food', this.value)" class="w-full p-3 mb-4 rounded-xl border font-bold">${options}</select><div id="food-list"></div>`;
                const list = d.food[month] || [];
                document.getElementById('food-list').innerHTML = list.map(i => `<div class="bg-white p-5 rounded-2xl shadow mb-4"><span class="${i.color} text-white px-3 py-1 rounded-full text-xs font-bold">${i.brand}</span><h3 class="font-bold text-lg my-2">${i.title}</h3><p class="text-gray-500 text-sm mb-4">${i.time}</p><div class="flex gap-3"><a href="${i.url}" class="bg-blue-600 text-white p-3 rounded-xl flex-1 text-center font-bold text-sm">前往優惠</a><a href="https://www.google.com/calendar/render?action=TEMPLATE&text=${i.title}" class="bg-gray-200 p-3 rounded-xl px-5 text-sm font-bold text-gray-700">+日曆</a></div></div>`).join('');
            } else if(tab === 'travel') {
                app.innerHTML = d.travel.map(i => `<a href="${i.url}" class="block bg-white p-5 rounded-2xl shadow mb-4 font-bold text-lg text-blue-700"><i class="fas fa-plane mr-2"></i>${i.title}</a>`).join('');
            } else if(tab === 'lounge') {
                app.innerHTML = `
                    <select id="c" onchange="up_city()" class="w-full p-4 border rounded-xl mb-3 font-bold"><option value="">選擇國家</option>${Object.keys(d.lounge).map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
                    <select id="ci" onchange="up_air()" class="w-full p-4 border rounded-xl mb-3"><option value="">選擇城市</option></select>
                    <select id="a" onchange="up_mem()" class="w-full p-4 border rounded-xl mb-3"><option value="">選擇機場</option></select>
                    <select id="m" onchange="show()" class="w-full p-4 border rounded-xl mb-3"><option value="">選擇會籍</option></select>
                    <div id="r"></div>`;
            } else if(tab === 'mileage') {
                let marriottHtml = (mileageData.marriott || []).map(item => `
                    <div class="bg-white p-4 rounded-2xl shadow border-l-4 ${item.border} mb-3">
                        <div class="flex justify-between items-center text-sm font-bold">
                            <span>每點成本 NT$ ${item.cost}</span>
                            <span class="${item.tagColor}">NT$ ${item.mile} / 哩</span>
                        </div>
                        <p class="text-xs text-gray-600 mt-1">總花費：NT$ ${item.total}</p>
                        <p class="text-xs ${item.tagColor} font-bold mt-1">${item.note}</p>
                    </div>
                `).join('');

                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-1 text-center">🏨 萬豪轉哩程成本效益表</h2>
                    <p class="text-xs text-gray-500 text-center mb-4">以 60,000 點轉 25,000 哩計算基準</p>
                    <div class="space-y-3">
                        ${marriottHtml}
                    </div>`;
            } else if(tab === 'note') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-10">
                        <h3 class="font-bold text-lg mb-3 text-gray-800"><i class="fas fa-microphone-alt text-blue-600 mr-2"></i>AI 智慧隨手記事</h3>
                        <textarea id="noteInput" placeholder="請輸入行程/記事，或輸入「查詢 8月份行程」..." class="w-full h-32 p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-3"></textarea>
                        <div class="flex gap-2">
                            <button onclick="startVoiceInput()" class="bg-emerald-600 text-white p-3 rounded-xl flex-1 font-bold text-sm shadow"><i class="fas fa-microphone mr-1"></i>語音輸入</button>
                            <button onclick="sendNote()" id="submitBtn" class="bg-blue-600 text-white p-3 rounded-xl flex-1 font-bold text-sm shadow">送出並 AI 整理</button>
                        </div>
                        <div id="resultMsg" class="mt-4 text-sm text-gray-600"></div>
                    </div>`;
            }
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("您的瀏覽器不支援語音辨識功能，請使用 Chrome 或 Safari。");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = false;
            const msg = document.getElementById('resultMsg');
            msg.innerText = "🎙️ 請開始說話...";

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('noteInput').value = speechText;
                msg.innerText = "✅ 語音辨識完成！";
            };
            recognition.onerror = function(event) {
                msg.innerText = "❌ 語音辨識發生錯誤：" + event.error;
            };
            recognition.start();
        }

        async function sendNote() {
            const text = document.getElementById('noteInput').value.trim();
            const msg = document.getElementById('resultMsg');
            const btn = document.getElementById('submitBtn');
            if (!text) { alert('請輸入內容'); return; }

            msg.innerText = "⏳ AI 正在處理中...";
            btn.disabled = true;

            try {
                const response = await fetch(scriptUrl, {
                    method: "POST",
                    body: JSON.stringify({ text: text })
                });
                const result = await response.json();
                if(result.status === "success") {
                    if (result.isQuery) {
                        msg.innerHTML = `📋 <b class='text-blue-600'>AI 查詢結果：</b><br>
                        <div class='mt-3 overflow-x-auto max-h-60 overflow-y-auto border rounded-lg'>
                            <table class='w-full border-collapse border border-gray-300 text-xs text-left bg-white shadow-sm'>
                                <thead class='sticky top-0 bg-blue-50 text-blue-700'>
                                    <tr>
                                        <th class='border border-gray-300 p-2'>日期</th>
                                        <th class='border border-gray-300 p-2'>時間</th>
                                        <th class='border border-gray-300 p-2'>地點</th>
                                        <th class='border border-gray-300 p-2'>內容說明</th>
                                    </tr>
                                </thead>
                                <tbody id='queryTableBody'>
                                    <tr><td colspan='4' class='p-3 text-center text-gray-500'>解析中...</td></tr>
                                </tbody>
                            </table>
                        </div>`;
                        
                        setTimeout(() => {
                            const tbody = document.getElementById('queryTableBody');
                            const lines = result.message.split('\n');
                            let rowsHtml = '';
                            
                            lines.forEach(line => {
                                if (line.includes('|') || line.includes('日期')) {
                                    let dMatch = line.match(/日期[：:]\s*([^\|]+)/);
                                    let tMatch = line.match(/時間[：:]\s*([^\|]+)/);
                                    let lMatch = line.match(/地點[：:]\s*([^\|]+)/);
                                    let cMatch = line.match(/內容[：:]\s*(.+)/) || line.match(/說明[：:]\s*(.+)/);
                                    
                                    let dateVal = dMatch ? dMatch[1].trim() : "-";
                                    let timeVal = tMatch ? tMatch[1].trim() : "-";
                                    let locVal = lMatch ? lMatch[1].trim() : "-";
                                    let contentVal = cMatch ? cMatch[1].trim() : line;
                                    
                                    if (dateVal !== "日期" && !line.includes("以下是")) {
                                        rowsHtml += `<tr class='hover:bg-gray-50'>
                                            <td class='border border-gray-300 p-2 font-medium text-gray-800'>${dateVal}</td>
                                            <td class='border border-gray-300 p-2 text-gray-600'>${timeVal}</td>
                                            <td class='border border-gray-300 p-2 text-gray-600'>${locVal}</td>
                                            <td class='border border-gray-300 p-2 text-gray-800'>${contentVal}</td>
                                        </tr>`;
                                    }
                                }
                            });
                            
                            if (rowsHtml === '') {
                                lines.forEach(line => {
                                    if (line.trim().length > 0 && !line.includes("以下是")) {
                                        rowsHtml += `<tr><td colspan='4' class='border border-gray-300 p-2 text-gray-800'>${line}</td></tr>`;
                                    }
                                });
                            }
                            
                            tbody.innerHTML = rowsHtml || `<tr><td colspan='4' class='p-3 text-center text-gray-500'>查無相關記錄</td></tr>`;
                        }, 100);

                    } else {
                        msg.innerHTML = "✅ 記錄成功！<br><span class='text-xs text-gray-500'>已自動存入 Google 試算表</span>";
                        document.getElementById('noteInput').value = "";
                    }
                } else {
                    msg.innerText = "❌ 失敗：" + result.message;
                }
            } catch (e) {
                msg.innerText = "❌ 發生錯誤：" + e;
            } finally {
                btn.disabled = false;
            }
        }

        function up_city() { const c=document.getElementById('c').value; document.getElementById('ci').innerHTML='<option value="">選擇城市</option>'+Object.keys(d.lounge[c]||{}).map(ci=>`<option value="${ci}">${ci}</option>`).join(''); }
        function up_air() { const c=document.getElementById('c').value, ci=document.getElementById('ci').value; document.getElementById('a').innerHTML='<option value="">選擇機場</option>'+Object.keys(d.lounge[c][ci]||{}).map(a=>`<option value="${a}">${a}</option>`).join(''); }
        function up_mem() { const c=document.getElementById('c').value, ci=document.getElementById('ci').value, a=document.getElementById('a').value; document.getElementById('m').innerHTML='<option value="">選擇會籍</option>'+Object.keys(d.lounge[c][ci][a]||{}).map(m=>`<option value="${m}">${m}</option>`).join(''); }
        function show() {
            const c=document.getElementById('c').value, ci=document.getElementById('ci').value, a=document.getElementById('a').value, m=document.getElementById('m').value;
            const s = d.lounge[c]?.[ci]?.[a]?.[m];
            if (s && s.length > 0) {
                const item = s[0];
                const imgs = item.img.map(url => `<img src="${url}" class="w-full sm:w-1/2 rounded-xl">`).join('');
                document.getElementById('r').innerHTML = `<div class="bg-white p-5 rounded-2xl shadow"><h3 class="font-bold text-lg">${item.name}</h3><p class="text-sm my-3 text-gray-600">${item.desc}</p><div class="flex flex-wrap gap-2">${imgs}</div></div>`;
            } else {
                document.getElementById('r').innerHTML = `<div class="p-4 text-center text-gray-400">目前無貴賓室資料</div>`;
            }
        }
    </script>
</body>
</html>
