<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>生活優惠中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto overflow-hidden">
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex flex-col items-center gap-2">
        <div class="text-xl font-bold">生活優惠中心</div>
    </header>
    
    <main id="app" class="flex-1 p-4 overflow-y-auto pb-28"></main>
    
    <nav class="bg-white border-t flex justify-between p-3 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] fixed bottom-0 w-full max-w-md mx-auto z-50 text-[11px]">
        <button onclick="render('food', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-gift text-lg mb-1"></i>優惠</button>
        <button onclick="render('travel', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-plane-departure text-lg mb-1"></i>行程</button>
        <button onclick="render('lounge', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-couch text-lg mb-1"></i>貴賓室</button>
        <button onclick="render('cube_calc', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-credit-card text-lg mb-1"></i>CUBE</button>
        <button onclick="render('mileage', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-chart-line text-lg mb-1"></i>哩程</button>
        <button onclick="render('note', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-microphone-alt text-lg mb-1"></i>記事</button>
    </nav>

    <script>
        let d = { food: {}, travel: [], lounge: {} };
        let mileageData = { marriott: [] };
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwVLmSnHAsJ8DjU9ZJgp5ZZThsxbPHAtXIQ7R93O_nTd-Uz8WrkdpyFhVwwxvTEddXq/exec";

        // 完整初始化載入
        Promise.all([
            fetch('data.json?t='+Date.now()).then(r => r.json()).catch(() => ({ food: {}, travel: [], lounge: {} })),
            fetch('mileage_data.json?t='+Date.now()).then(r => r.json()).catch(() => ({ marriott: [] }))
        ]).then(([resData, resMileage]) => {
            d = resData; mileageData = resMileage; render('food');
        });

        function render(tab, ev = null) {
            const app = document.getElementById('app');
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('text-blue-600', 'font-bold'));
            if (ev) ev.currentTarget.classList.add('text-blue-600', 'font-bold');

            if(tab === 'food') {
                app.innerHTML = `<div id="food-list" class="space-y-4">載入中...</div>`;
                const list = d.food ? d.food[new Date().getMonth() + 1] || [] : [];
                document.getElementById('food-list').innerHTML = list.map(i => `<div class="bg-white p-5 rounded-2xl shadow"><h3 class="font-bold">${i.title}</h3><a href="${i.url}" class="text-blue-600">前往優惠</a></div>`).join('');
            } else if(tab === 'cube_calc') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow">
                        <h3 class="font-bold text-lg mb-4 text-center">CUBE 卡權益精算</h3>
                        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="🔍 輸入店名..." class="w-full p-3 border rounded-xl mb-3">
                        <div id="storeResult" class="p-3 bg-blue-50 rounded-xl mb-4 hidden"></div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <input type="number" id="consumeAmt" placeholder="金額" class="p-3 border rounded-xl" oninput="calcPoints()">
                            <input type="number" id="consumeRate" placeholder="回饋率(%)" class="p-3 border rounded-xl" oninput="calcPoints()">
                        </div>
                        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-gray-50 rounded-xl">預估小樹點：0 點</div>
                    </div>`;
            } else if(tab === 'mileage') {
                app.innerHTML = `<div class="p-4 text-center">哩程計算功能載入中...</div>`;
                // (此處保留你原本長榮哩程計算器的詳細邏輯程式碼...)
            } else {
                app.innerHTML = `<div class="text-center mt-10">其他頁籤功能運作中...</div>`;
            }
        }

        async function searchStore() {
            const val = document.getElementById('storeSearch').value;
            const resDiv = document.getElementById('storeResult');
            try {
                const response = await fetch('cube_config.json?t='+Date.now());
                const data = await response.json();
                const match = data.stores.find(s => s.name.includes(val));
                if (match) {
                    resDiv.classList.remove('hidden');
                    resDiv.innerHTML = `推薦方案：${match.plan} (回饋 ${match.rate*100}%)`;
                    document.getElementById('consumeRate').value = match.rate * 100;
                    calcPoints();
                } else { resDiv.classList.add('hidden'); }
            } catch(e) { console.error(e); }
        }

        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0;
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            document.getElementById('pointResult').innerText = `預估小樹點：${Math.round(amt * rate)} 點`;
        }
    </script>
</body>
</html>
