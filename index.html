<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 強制防快取機制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <title>生活優惠中心</title>
    <!-- Tailwind CSS 樣式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto overflow-hidden">
    
    <!-- 頂部 Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex flex-col items-center gap-2">
        <div class="text-xl font-bold">生活優惠中心</div>
        <div class="w-full max-w-xs text-xs font-normal text-gray-800">
            <select id="globalSkillSelect" onchange="loadSelectedSkill(this.value)" class="w-full p-2 rounded-lg border bg-white shadow-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="default">🌐 AI 模式：通用助手</option>
                <option value="japan-fireworks">🎆 AI 模式：日本花火節攻略助手</option>
                <option value="hotel-points">🏨 AI 模式：飯店點數房比價助手</option>
            </select>
        </div>
    </header>

    <!-- 主畫面內容區 -->
    <main id="app" class="flex-1 p-4 overflow-y-auto pb-28"></main>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t flex justify-between p-3 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] fixed bottom-0 w-full max-w-md mx-auto z-50 text-[11px]">
        <button onclick="render('food', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-gift text-lg mb-1"></i>優惠
        </button>
        <button onclick="render('travel', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-plane-departure text-lg mb-1"></i>行程
        </button>
        <button onclick="render('lounge', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-couch text-lg mb-1"></i>貴賓室
        </button>
        <button onclick="render('cube_calc', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-credit-card text-lg mb-1"></i>CUBE
        </button>
        <button onclick="render('calc_mileage', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-calculator text-lg mb-1"></i>精算哩程
        </button>
        <button onclick="render('note', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-microphone-alt text-lg mb-1"></i>記事
        </button>
    </nav>

    <script>
        // 核心資料變數
        let d = { food: {}, travel: [], lounge: {} };
        let mileageData = { marriott: [] };
        let ex_twd = 32.50;
        let ex_cny = 7.15;
        let ex_jpy = 145.0;
        let currentSystemPrompt = "";
        let currentSkillName = "通用助手";
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwVLmSnHAsJ8DjU9ZJgp5ZZThsxbPHAtXIQ7R93O_nTd-Uz8WrkdpyFhVwwxvTEddXq/exec";
        
        // AI 模式切換邏輯
        async function loadSelectedSkill(skillId) {
            if (skillId === 'default') {
                currentSystemPrompt = "";
                currentSkillName = "通用助手";
                render('note');
                const badge = document.getElementById('skillStatusBadge');
                if (badge) badge.innerText = "目前模式：通用助手";
                return;
            }
            try {
                const res = await fetch(`./skills/${skillId}.json?t=` + Date.now());
                const skillData = await res.json();
                currentSystemPrompt = skillData.systemPrompt || "";
                currentSkillName = skillData.name || skillId;
                render('note');
            } catch (e) {
                console.error("載入 Skill 失敗:", e);
            }
        }

        // 初始化載入所有外部 JSON 與匯率
        Promise.all([
            fetch('data.json?t=' + Date.now()).then(r => r.json()).catch(() => ({ food: {}, travel: [], lounge: {} })),
            fetch('mileage_data.json?t=' + Date.now()).then(r => r.json()).catch(() => ({ marriott: [] })),
            fetch('https://api.exchangerate-api.com/v4/latest/USD').then(r => r.json()).catch(() => null)
        ]).then(([resData, resMileage, exData]) => {
            d = resData || { food: {}, travel: [], lounge: {} };
            mileageData = resMileage || { marriott: [] };
            
            if(exData && exData.rates) {
                ex_twd = exData.rates.TWD;
                ex_cny = exData.rates.CNY;
                ex_jpy = exData.rates.JPY;
                
                // 若當下停留在精算頁面，立即更新畫面匯率
                if(document.getElementById('calc_currency')) {
                    updateCurrencyRate('calc');
                    updateCurrencyRate('ihg_calc');
                }
            }
            // 預設渲染首頁
            render('food');
        });

        // 完整路由與畫面渲染引擎
        function render(tab, ev = null) {
            const app = document.getElementById('app');
            if (!app) return;

            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-blue-600', 'font-bold');
                btn.classList.add('text-gray-600');
            });
            if (ev && ev.currentTarget) {
                ev.currentTarget.classList.add('text-blue-600', 'font-bold');
            }

            let month = new Date().getMonth() + 1;

            if (tab === 'food') {
                let options = Array.from({length: 12}, (_, i) => {
                    const m = i + 1;
                    const selected = m === month ? 'selected' : '';
                    return `<option value="${m}" ${selected}>${m}月份</option>`;
                }).join('');
                
                app.innerHTML = `
                    <!-- 頂部切換按鈕 -->
                    <div class="flex gap-2 mb-4">
                        <button onclick="render('food')" class="food-tab-btn flex-1 bg-blue-600 text-white p-2.5 rounded-xl font-bold text-sm shadow transition-colors">🗓️ 本月優惠</button>
                        <button onclick="loadDeliveryCoupons()" class="food-tab-btn flex-1 bg-emerald-50 text-emerald-700 p-2.5 rounded-xl font-bold text-sm shadow hover:bg-emerald-600 hover:text-white transition-colors border border-emerald-100">🛵 外送/信用卡即時碼</button>
                    </div>
                    
                    <div id="food-dynamic-content">
                        <select onchange="renderFoodMonth(this.value)" class="w-full p-3 mb-4 rounded-xl border font-bold bg-white shadow-sm">
                            ${options}
                        </select>
                        <div id="food-list"></div>
                    </div>
                `;
                renderFoodMonth(month);

            } else if (tab === 'travel') {
                const fireworksTravelList = [
                    {
                        title: "長岡祭大花火大會",
                        tag: "🎆 日本三大花火",
                        tagColor: "bg-rose-500",
                        date: "2027/08/02 - 08/03",
                        location: "新潟縣長岡市信濃川",
                        airport: "成田 (NRT) / 羽田 (HND) / 新潟 (KIJ)",
                        url: "https://nagaokamatsuri.com/",
                        calUrl: "https://www.google.com/calendar/render?action=TEMPLATE&text=長岡祭大花火大會&dates=20270802T112000Z/20270803T131000Z&location=新潟縣長岡市"
                    },
                    {
                        title: "洞爺湖花火大會 (冬花火/長跑花火)",
                        tag: "🎆 北海道溫泉花火",
                        tagColor: "bg-amber-500",
                        date: "2027/02月上旬 (冬) ｜ 4/28-10/31 (長跑)",
                        location: "北海道洞爺湖溫泉湖畔",
                        airport: "新千歲機場 (CTS)",
                        url: "https://www.laketoya.com/event/fireworks/",
                        calUrl: "https://www.google.com/calendar/render?action=TEMPLATE&text=洞爺湖花火大會&location=洞爺湖溫泉"
                    }
                ];

                let fireworksCardsHtml = fireworksTravelList.map(item => `
                    <div class="bg-white p-5 rounded-2xl shadow mb-4 border-l-4 border-blue-500">
                        <div class="flex justify-between items-center mb-2">
                            <span class="${item.tagColor} text-white px-3 py-1 rounded-full text-xs font-bold">${item.tag}</span>
                            <span class="text-xs text-gray-500 font-bold">${item.location}</span>
                        </div>
                        <h3 class="font-bold text-lg my-1 text-gray-800">${item.title}</h3>
                        <p class="text-gray-600 text-xs my-1"><i class="far fa-calendar-alt mr-1 text-blue-500"></i><b>日期：</b>${item.date}</p>
                        <p class="text-gray-600 text-xs mb-3"><i class="fas fa-plane-arrival mr-1 text-blue-500"></i><b>建議機場：</b>${item.airport}</p>
                        <div class="flex gap-2">
                            <a href="${item.url}" target="_blank" class="bg-blue-600 text-white p-2.5 rounded-xl flex-1 text-center font-bold text-xs shadow hover:bg-blue-700 transition">查看官方攻略</a>
                            <a href="${item.calUrl}" target="_blank" class="bg-gray-100 p-2.5 rounded-xl text-xs font-bold text-gray-700 hover:bg-gray-200 transition">+ 日曆</a>
                        </div>
                    </div>
                `).join('');

                let filteredTravel = (d.travel || []).filter(i => !i.title.includes('韓國') && !i.title.includes('7月'));
                let userTravelHtml = filteredTravel.map(i => `
                    <a href="${i.url}" target="_blank" class="block bg-white p-5 rounded-2xl shadow mb-4 font-bold text-lg text-blue-700 hover:bg-blue-50 transition">
                        <i class="fas fa-plane mr-2"></i>${i.title}
                    </a>
                `).join('');

                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center text-gray-800"><i class="fas fa-plane-departure text-blue-600 mr-2"></i>精選花火與旅行行程</h2>
                    <div class="mb-4">${fireworksCardsHtml}</div>
                    <h3 class="font-bold text-base my-3 text-gray-700 border-b pb-2"><i class="fas fa-bookmark text-blue-500 mr-1.5"></i>常用旅行連結</h3>
                    <div>${userTravelHtml}</div>
                `;

            } else if (tab === 'lounge') {
                let loungeKeys = d.lounge ? Object.keys(d.lounge) : [];
                let countryOptions = loungeKeys.map(c => `<option value="${c}">${c}</option>`).join('');
                
                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-4 text-center text-gray-800"><i class="fas fa-couch text-blue-600 mr-2"></i>貴賓室查詢</h2>
                    <select id="c" onchange="up_city()" class="w-full p-4 border rounded-xl mb-3 font-bold bg-white">
                        <option value="">選擇國家</option>
                        ${countryOptions}
                    </select>
                    <select id="ci" onchange="up_air()" class="w-full p-4 border rounded-xl mb-3 bg-white">
                        <option value="">選擇城市</option>
                    </select>
                    <select id="a" onchange="up_mem()" class="w-full p-4 border rounded-xl mb-3 bg-white">
                        <option value="">選擇機場</option>
                    </select>
                    <select id="m" onchange="show()" class="w-full p-4 border rounded-xl mb-3 bg-white">
                        <option value="">選擇會籍</option>
                    </select>
                    <div id="r" class="mt-4"></div>
                `;

            } else if (tab === 'cube_calc') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-10">
                        <h3 class="font-bold text-lg mb-3 text-gray-800 text-center"><i class="fas fa-credit-card text-blue-600 mr-2"></i>CUBE 卡權益精算</h3>
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs mb-4">
                            <b>💡 童樂匯解鎖提醒：</b>需「親子與未成年子女皆持有本行帳戶」且「持有有效 CUBE 正卡」始可切換！
                        </div>
                        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="🔍 輸入店名速查 (例: 7-11)..." class="w-full p-3 border rounded-xl mb-3 bg-gray-50 text-sm">
                        <div id="storeResult" class="p-3 bg-blue-50 rounded-xl mb-4 text-sm font-bold text-blue-800 hidden"></div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <label class="block text-gray-500 text-xs mb-1 font-bold">消費金額</label>
                                <input type="number" id="consumeAmt" placeholder="金額" class="w-full p-3 border rounded-xl text-sm" oninput="calcPoints()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-xs mb-1 font-bold">回饋率 (%)</label>
                                <input type="number" id="consumeRate" placeholder="回饋率" class="w-full p-3 border rounded-xl text-sm" oninput="calcPoints()">
                            </div>
                        </div>
                        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-gray-50 rounded-xl">預估小樹點：0 點</div>
                    </div>
                `;

            } else if (tab === 'calc_mileage') {
                let marriottHtml = (mileageData.marriott || []).map(item => `
                    <div class="bg-white p-4 rounded-2xl shadow border-l-4 ${item.border || 'border-blue-500'} mb-3">
                        <div class="flex justify-between items-center text-sm font-bold">
                            <span>每點成本 NT$ ${item.cost}</span>
                            <span class="${item.tagColor || 'text-blue-600'}">NT$ ${item.mile} / 哩</span>
                        </div>
                        <p class="text-xs text-gray-600 mt-1">總花費：NT$ ${item.total}</p>
                        <p class="text-xs ${item.tagColor || 'text-blue-600'} font-bold mt-1">${item.note}</p>
                    </div>
                `).join('');

                app.innerHTML = `
                    <!-- 區塊 1：萬豪住房點數專業精算 -->
                    <div class="bg-white p-5 rounded-2xl shadow mb-6">
                        <h3 class="font-bold text-lg mb-4 text-center text-blue-700">
                            <i class="fas fa-calculator mr-2"></i>萬豪住房點數專業精算
                        </h3>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">結帳幣別 (自動轉美金)</label>
                                <select id="calc_currency" onchange="updateCurrencyRate('calc')" class="w-full p-2.5 border rounded-xl bg-blue-50 text-blue-800 font-bold">
                                    <option value="CNY">人民幣 (CNY)</option>
                                    <option value="USD">美元 (USD)</option>
                                    <option value="TWD">台幣 (TWD)</option>
                                    <option value="JPY">日幣 (JPY)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">兌美金匯率 (1 USD=?)</label>
                                <input type="number" id="calc_rate" value="${ex_cny.toFixed(2)}" step="0.01" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm text-gray-400" oninput="drawProCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">計分單晚房費 (原價)</label>
                                <input type="number" id="calc_night_price" value="600" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">稅費扣除 (反推淨價)</label>
                                <select id="calc_tax" onchange="drawProCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium">
                                    <option value="1">已是淨價 (不扣除)</option>
                                    <option value="1.166" selected>扣除 16.6% (中/台常態)</option>
                                    <option value="1.1">扣除 10% (日本常態)</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">晚數</label>
                                <input type="number" id="calc_nights" value="1" min="1" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                            <div>
                                <label class="block text-emerald-600 text-[11px] mb-1 font-bold">實際總支付 (同幣別,扣折扣)</label>
                                <input type="number" id="calc_actual_paid" placeholder="若無折扣免填" class="w-full p-2.5 border rounded-xl bg-emerald-50 font-medium text-sm text-emerald-800 border-emerald-200" oninput="drawProCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">萬豪會籍</label>
                                <select id="calc_tier" onchange="drawProCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium">
                                    <option value="0">白板會員 (0%)</option>
                                    <option value="0.1">銀卡 (+10%)</option>
                                    <option value="0.25">金卡 (+25%)</option>
                                    <option value="0.5">白金卡 (+50%)</option>
                                    <option value="0.75" selected>鈦金/大使 (+75%)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">迎賓禮</label>
                                <input type="number" id="calc_welcome_gift" value="1000" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
                            <div>
                                <label class="block text-rose-600 text-[11px] mb-1 font-bold">額外手續費 (台幣 NT$)</label>
                                <input type="number" id="calc_service_fee" value="0" placeholder="0" class="w-full p-2.5 border rounded-xl bg-rose-50 font-bold text-sm text-rose-700 border-rose-200" oninput="drawProCalc()">
                            </div>
                            <div></div>
                        </div>
                        <div id="calc_table_result" class="mt-4"></div>
                        <div class="text-center text-[10px] text-gray-400 mt-3"><i class="fas fa-sync-alt mr-1"></i>系統已自動抓取即時美金匯率試算</div>
                    </div>

                    <!-- 區塊 2：IHG 住房點數專業精算 -->
                    <div class="bg-white p-5 rounded-2xl shadow mb-8">
                        <h3 class="font-bold text-lg mb-4 text-center text-orange-600">
                            <i class="fas fa-calculator mr-2"></i>IHG 積分 vs 長榮哩程 精算
                        </h3>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">結帳幣別 (自動轉美金)</label>
                                <select id="ihg_calc_currency" onchange="updateCurrencyRate('ihg_calc')" class="w-full p-2.5 border rounded-xl bg-orange-50 text-orange-800 font-bold">
                                    <option value="CNY">人民幣 (CNY)</option>
                                    <option value="USD">美元 (USD)</option>
                                    <option value="TWD">台幣 (TWD)</option>
                                    <option value="JPY">日幣 (JPY)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">兌美金匯率 (1 USD=?)</label>
                                <input type="number" id="ihg_calc_rate" value="${ex_cny.toFixed(2)}" step="0.01" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm text-gray-400" oninput="drawIhgCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">計分單晚房費 (原價)</label>
                                <input type="number" id="ihg_calc_night_price" value="300" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawIhgCalc()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">稅費扣除 (反推淨價)</label>
                                <select id="ihg_calc_tax" onchange="drawIhgCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium">
                                    <option value="1">已是淨價 (不扣除)</option>
                                    <option value="1.166" selected>扣除 16.6% (中/台常態)</option>
                                    <option value="1.1">扣除 10% (日本常態)</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">晚數</label>
                                <input type="number" id="ihg_calc_nights" value="1" min="1" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawIhgCalc()">
                            </div>
                            <div>
                                <label class="block text-emerald-600 text-[11px] mb-1 font-bold">實際總支付 (同幣別,扣折扣)</label>
                                <input type="number" id="ihg_calc_actual_paid" placeholder="若無折扣免填" class="w-full p-2.5 border rounded-xl bg-emerald-50 font-medium text-sm text-emerald-800 border-emerald-200" oninput="drawIhgCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">每晚加贈活動</label>
                                <select id="ihg_calc_per_night_bonus" onchange="drawIhgCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm">
                                    <option value="0">無</option>
                                    <option value="4n8k">4N8K (每晚 2000 點)</option>
                                    <option value="2n2k">2N2K (每晚 1000 點)</option>
                                    <option value="double">雙倍積分</option>
                                </select>
                            </div>
                            <div>

        async function loadDeliveryCoupons() {
            // 切換按鈕樣式
            const btns = document.querySelectorAll('.food-tab-btn');
            if (btns.length >= 2) {
                btns[0].className = "food-tab-btn flex-1 bg-blue-50 text-blue-700 p-2.5 rounded-xl font-bold text-sm shadow hover:bg-blue-600 hover:text-white transition-colors border border-blue-100";
                btns[1].className = "food-tab-btn flex-1 bg-emerald-600 text-white p-2.5 rounded-xl font-bold text-sm shadow transition-colors";
            }
            
            const container = document.getElementById('food-dynamic-content');
            if (!container) return;
            
            container.innerHTML = '<div class="text-center text-gray-500 py-16"><i class="fas fa-spinner fa-spin text-3xl mb-3 text-emerald-500"></i><br>正在從 GitHub 即時解析各家優惠與信用卡...</div>';
            
            try {
                // 直接抓取 README.md 原始碼
                const res = await fetch('https://raw.githubusercontent.com/ridemountainpig/tasty-coupon/main/README.md');
                if (!res.ok) throw new Error("Fetch failed");
                const mdText = await res.text();
                
                const lines = mdText.split('\n');
                let htmlBuffer = '';
                
                let currentGroup = '綜合優惠';
                let brandColor = 'border-gray-300';
                let btnColor = 'text-gray-600';

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;
                    
                    // 偵測標題作為分類名稱
                    if (!line.startsWith('|') && !line.startsWith('<') && !line.startsWith('![')) {
                        let cleanTitle = line.replace(/#/g, '').replace(/\*/g, '').trim();
                        if (cleanTitle.length > 0 && cleanTitle.length < 40) {
                            currentGroup = cleanTitle;
                            if (currentGroup.toLowerCase().includes('uber')) { brandColor = 'border-green-500'; btnColor = 'text-green-600'; }
                            else if (currentGroup.toLowerCase().includes('panda') || currentGroup.includes('熊貓')) { brandColor = 'border-pink-500'; btnColor = 'text-pink-600'; }
                            else if (currentGroup.includes('信用卡') || currentGroup.includes('聯名卡')) { brandColor = 'border-blue-500'; btnColor = 'text-blue-600'; }
                            else { brandColor = 'border-gray-500'; btnColor = 'text-gray-700'; }
                        }
                    }
                    
                    // 偵測到表格標頭
                    if (line.startsWith('|') && line.includes('|')) {
                        let headers = line.split('|').map(h => h.trim()).filter(h => h);
                        
                        // 判斷是「信用卡表」還是「優惠碼表」
                        let isCreditCardTable = headers.some(h => h.includes('回饋') || h.includes('銀行') || h.includes('支付工具'));
                        let isCouponTable = headers.some(h => h.includes('優惠碼') || h.includes('優惠內容') || (h.includes('優惠') && h.includes('代碼')));

                        if (isCreditCardTable || isCouponTable) {
                            // 跳過分隔線
                            if (i + 1 < lines.length && lines[i+1].includes('---')) i++;
                            
                            // 開始解析每一列
                            while (i + 1 < lines.length && lines[i+1].trim().startsWith('|')) {
                                i++;
                                let cols = lines[i].split('|');
                                if (cols[0].trim() === '') cols.shift();
                                if (cols.length > 0 && cols[cols.length - 1].trim() === '') cols.pop();
                                cols = cols.map(c => c.trim().replace(/<[^>]*>?/gm, '')); // 移除 HTML 標籤
                                
                                // ★ 處理「信用卡表格」
                                if (isCreditCardTable && cols.length >= 4) {
                                    let type = cols[0] || '';
                                    let bank = cols[1] || '';
                                    let reward = cols[2] || '';
                                    let scope = cols[3] || '';
                                    let expire = cols[4] || '依公告';
                                    let tag = cols[5] || '';
                                    let note = cols[6] || '';
                                    
                                    htmlBuffer += `
                                        <div class="bg-white p-4 rounded-2xl shadow mb-3 border-l-4 border-blue-500">
                                            <div class="flex justify-between items-center mb-2 gap-2">
                                                <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-[10px] font-bold whitespace-nowrap">💳 ${bank}</span>
                                                <span class="text-[10px] text-gray-500 font-bold bg-gray-100 px-2 py-1 rounded whitespace-nowrap">⏳ ${expire}</span>
                                            </div>
                                            <div class="flex justify-between items-end mb-2">
                                                <h4 class="font-bold text-gray-800 text-sm leading-snug flex-1">🎯 ${scope}</h4>
                                                <div class="text-rose-600 font-bold text-base ml-2 whitespace-nowrap">${reward}</div>
                                            </div>
                                            ${note ? `<div class="text-[11px] bg-blue-50 text-blue-700 p-2 rounded-lg border border-blue-100 leading-relaxed mt-2">💡 ${note}</div>` : ''}
                                        </div>
                                    `;
                                } 
                                // ★ 處理「優惠碼表格」
                                else if (isCouponTable && cols.length >= 2) {
                                    let title = cols[0].replace(/\(複製並前往使用\)/gi, '').replace(/\(前往合作頁面\)/gi, '').trim();
                                    let codeStr = cols[1].replace(/\(複製並前往使用\)/gi, '').replace(/\(前往合作頁面\)/gi, '').trim();
                                    let expire = cols[2] ? cols[2] : '依公告';
                                    let target = cols[3] ? cols[3] : '無限制';
                                    
                                    // 解析 Markdown 超連結 [text](url)
                                    let linkMatch = codeStr.match(/\[(.*?)\]\((.*?)\)/);
                                    if (linkMatch) {
                                        codeStr = linkMatch[1]; 
                                    }
                                    
                                    let actionHtml = '';
                                    if (codeStr === '立即領取優惠' || codeStr.includes('領取優惠') || codeStr.includes('指定連結') || codeStr.includes('當日公布')) {
                                       actionHtml = `<div class="text-xs text-blue-600 mt-2 font-bold bg-blue-50 p-2.5 rounded-xl text-center border border-blue-100">🔗 點擊 App 內領取 / 自動派發</div>`;
                                    } else if (codeStr && codeStr.length < 30) {
                                       actionHtml = `
                                            <div class="bg-gray-50 p-2.5 rounded-xl border border-dashed border-gray-300 flex justify-between items-center mt-2">
                                                <span class="font-mono font-bold text-lg tracking-wider ${btnColor}">${codeStr}</span>
                                                <button onclick="navigator.clipboard.writeText('${codeStr}'); alert('已複製優惠碼：${codeStr}')" class="text-xs bg-white border border-gray-200 text-gray-700 px-3 py-1.5 rounded-lg font-bold shadow-sm hover:bg-gray-100 transition-colors">複製</button>
                                            </div>
                                       `;
                                    } else {
                                       actionHtml = `<div class="text-xs text-gray-500 mt-2 font-bold">${codeStr}</div>`;
                                    }

                                    htmlBuffer += `
                                        <div class="bg-white p-4 rounded-2xl shadow mb-3 border-l-4 ${brandColor}">
                                            <div class="flex justify-between items-start mb-2 gap-2">
                                                <span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-[10px] font-bold leading-none inline-block">${currentGroup}</span>
                                                <span class="text-[10px] text-rose-600 font-bold bg-rose-50 px-2 py-1 rounded border border-rose-100 whitespace-nowrap">⏳ ${expire}</span>
                                            </div>
                                            <h4 class="font-bold text-gray-800 text-sm mb-1 leading-snug">${title}</h4>
                                            ${target !== '無限制' && target !== '' ? `<p class="text-[11px] text-gray-500 mb-2">🎯 適用：${target}</p>` : ''}
                                            ${actionHtml}
                                        </div>
                                    `;
                                }
                            }
                        }
                    }
                }
                
                if (htmlBuffer) {
                    container.innerHTML = `<div class="mb-4 animate-[fadeIn_0.5s_ease-in-out]">${htmlBuffer}</div>`;
                } else {
                    container.innerHTML = '<div class="text-center text-gray-400 py-10">目前暫無可用的優惠</div>';
                }
                
            } catch (e) {
                console.error("載入優惠失敗:", e);
                container.innerHTML = '<div class="text-center text-rose-500 py-10 font-bold"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><br>無法連線至 GitHub 解析檔案。</div>';
            }
        }

        function updateCurrencyRate(calcPrefix) {
            const currency = document.getElementById(calcPrefix + '_currency').value;
            const rateInput = document.getElementById(calcPrefix + '_rate');
            
            if (currency === 'CNY') {
                rateInput.value = ex_cny.toFixed(2);
            } else if (currency === 'TWD') {
                rateInput.value = ex_twd.toFixed(2);
            } else if (currency === 'JPY') {
                rateInput.value = ex_jpy.toFixed(2);
            } else if (currency === 'USD') {
                rateInput.value = (1.00).toFixed(2);
            }
            
            if (calcPrefix === 'calc') drawProCalc();
            if (calcPrefix === 'ihg_calc') drawIhgCalc();

        async function searchStore() {
            const val = document.getElementById('storeSearch').value.trim().toLowerCase();
            const resDiv = document.getElementById('storeResult');
            
            if (!val) { 
                resDiv.classList.add('hidden'); 
                return; 
            }
            
            try {
                const response = await fetch('https://gn1884728.github.io/cube-calc/cube_config.json?t=' + Date.now());
                const data = await response.json();
                let matchedList = [];
                
                if (data.plans) {
                    for (const [planName, stores] of Object.entries(data.plans)) {
                        const found = stores.find(s => s.name.toLowerCase().includes(val));
                        if (found) {
                            matchedList.push({ plan: planName, name: found.name, rate: found.rate });
                        }
                    }
                }

                if (matchedList.length > 0) {
                    resDiv.classList.remove('hidden');
                    let html = `找到 ${matchedList.length} 個適用方案：<br>`;
                    matchedList.forEach(m => {
                        html += `&bull; <b>${m.name}</b> ➔ 方案：<b>${m.plan}</b> (${m.rate*100}%)<br>`;
                    });
                    resDiv.innerHTML = html;
                    document.getElementById('consumeRate').value = matchedList[0].rate * 100;
                    calcPoints();
                } else {
                    resDiv.classList.remove('hidden');
                    resDiv.innerHTML = `未找到符合通路，請手動確認`;
                }
            } catch(e) { 
                console.error("搜尋錯誤:", e); 
            }
        }

        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0;
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            const points = Math.round(amt * rate);
            document.getElementById('pointResult').innerText = `預估小樹點：${points} 點`;
        }

        // 萬豪專業精算表格邏輯
        function drawProCalc() {
            const container = document.getElementById('calc_table_result');
            if (!container) return;

            const currency = document.getElementById('calc_currency').value;
            const rate = parseFloat(document.getElementById('calc_rate').value) || 1;
            const nightPrice = parseFloat(document.getElementById('calc_night_price').value) || 0;
            const nights = parseInt(document.getElementById('calc_nights').value) || 1;
            const taxDivisor = parseFloat(document.getElementById('calc_tax').value) || 1;
            const welcomeGift = parseFloat(document.getElementById('calc_welcome_gift').value) || 0;
            const tierBonusRate = parseFloat(document.getElementById('calc_tier').value) || 0;
            const serviceFee = parseFloat(document.getElementById('calc_service_fee').value) || 0;
            const actualPaidInput = document.getElementById('calc_actual_paid').value;

            const actualPaid = actualPaidInput !== "" ? parseFloat(actualPaidInput) : (nightPrice * nights);

            const qualifySpendPerNight = nightPrice / taxDivisor;
            const totalQualifySpend = qualifySpendPerNight * nights;
            
            let spendUSD = totalQualifySpend;
            if (currency !== 'USD') {
                spendUSD = totalQualifySpend / rate;
            }

            let actualPaidUSD = actualPaid;
            if (currency !== 'USD') {
                actualPaidUSD = actualPaid / rate;
            }
            
            let actualPaidNTD = actualPaidUSD * ex_twd;
            let totalCostNTD = Math.round(actualPaidNTD) + serviceFee;

            const basePoints = Math.round(spendUSD * 10);
            const tierPoints = Math.round(basePoints * tierBonusRate);
            
            const pointValueRate = 0.23;

            const scenarios = [
                { name: "基本累積", pts: basePoints + tierPoints + welcomeGift }
            ];

            let tableRows = scenarios.map(s => {
                const totalValueNTD = Math.round(s.pts * pointValueRate);
                const netRoomCost = totalCostNTD - totalValueNTD;
                
                const netColor = netRoomCost <= 0 ? "text-emerald-600" : "text-gray-800";
                const netText = netRoomCost <= 0 ? `倒賺 NT$ ${Math.abs(netRoomCost).toLocaleString()}` : `NT$ ${netRoomCost.toLocaleString()}`;

                return `
                    <tr class="border-b">
                        <td class="p-2 font-medium text-left">${s.name}</td>
                        <td class="p-2 font-bold text-gray-800">
                            ${s.pts.toLocaleString()}
                            <div class="text-[10px] text-gray-500 font-normal">NT$ ${totalValueNTD.toLocaleString()}</div>
                        </td>
                        <td class="p-2 ${netColor} font-bold text-base bg-emerald-50/30">${netText}</td>
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <div class="text-sm font-bold text-gray-700 mb-2 bg-blue-50 border border-blue-100 p-2.5 rounded-lg text-center shadow-sm">
                    💰 本次實際總支出 (含手續費)：<span class="text-blue-700">NT$ ${totalCostNTD.toLocaleString()}</span>
                </div>
                <table class="w-full border-collapse border border-gray-200 text-center bg-white shadow-sm rounded-xl overflow-hidden text-xs">
                    <thead class="bg-blue-50 text-blue-700 font-bold">
                        <tr>
                            <th class="border p-2 text-left w-1/3">方案</th>
                            <th class="border p-2 w-1/3">積分 (價值)</th>
                            <th class="border p-2 w-1/3">回血後淨房費</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;
        }

            if (currency !== 'USD') {

            container.innerHTML = `
                <div class="text-sm font-bold text-gray-700 mb-2 bg-orange-50 border border-orange-100 p-2.5 rounded-lg text-center shadow-sm">
                    💰 本次實際總支出 (含手續費)：<span class="text-orange-700">NT$ ${totalCostNTD.toLocaleString()}</span>
                </div>
                <table class="w-full border-collapse border border-gray-200 text-center bg-white shadow-sm rounded-xl overflow-hidden text-xs">
                    <thead class="bg-orange-50 text-orange-700 font-bold">
                        <tr>
                            <th class="border p-2 text-left w-[22%]">方案</th>
                            <th class="border p-2 w-[22%]">積分(價值)</th>
                            <th class="border p-2 w-[22%]">長榮500哩</th>
                            <th class="border p-2 w-[34%]">回血後淨房費比較</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;
        }

        // 渲染優惠月份
        function renderFoodMonth(month) {
            const foodList = document.getElementById('food-list');
            if (!foodList) return;
            
            const list = (d.food && d.food[month]) || [];
            if (list.length === 0) {
                foodList.innerHTML = '<p class="text-center text-gray-400 py-4">目前尚無此月份優惠</p>';
                return;
            }
            
            foodList.innerHTML = list.map(i => `
                <div class="bg-white p-5 rounded-2xl shadow mb-4">
                    <span class="${i.color || 'bg-blue-500'} text-white px-3 py-1 rounded-full text-xs font-bold">${i.brand}</span>
                    <h3 class="font-bold text-lg my-2">${i.title}</h3>
                    <p class="text-gray-500 text-sm mb-4">${i.time}</p>
                    <div class="flex gap-3">
                        <a href="${i.url}" class="bg-blue-600 text-white p-3 rounded-xl flex-1 text-center font-bold text-sm shadow">前往優惠</a>
                        <a href="https://www.google.com/calendar/render?action=TEMPLATE&text=${i.title}" class="bg-gray-200 p-3 rounded-xl px-5 text-sm font-bold text-gray-700">+日曆</a>
                    </div>
                </div>
            `).join('');
        }

        // 長榮哩程試算表
        function drawEvaCalc() {
            const container = document.getElementById('eva_calc_result');
            if (!container) return;
            
            const route = document.getElementById('eva_route').value;
            const pax = parseInt(document.getElementById('eva_pax').value) || 1;
            
            const rates = { 
                japan: { eco: 37500, biz: 57500 }, 
                usa: { eco: 70000, biz: 140000 }, 
                europe: { eco: 75000, biz: 150000 } 
            };
            const target = rates[route];
            const valPerMile = 0.45;

            container.innerHTML = `
                <table class="w-full border-collapse border border-gray-200 text-center bg-white shadow-sm rounded-lg overflow-hidden text-xs">
                    <thead class="bg-blue-50 text-blue-700 font-bold">
                        <tr>
                            <th class="border p-2">艙等</th>
                            <th class="border p-2">單人哩程</th>
                            <th class="border p-2">總共 (${pax}人)</th>
                            <th class="border p-2">估值 (NT$)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="border p-2 font-medium">經濟艙</td>
                            <td class="border p-2 font-bold">${target.eco.toLocaleString()}</td>
                            <td class="border p-2 text-blue-600 font-bold">${(target.eco * pax).toLocaleString()}</td>
                            <td class="border p-2 text-emerald-600 font-bold">NT$ ${Math.round(target.eco * pax * valPerMile).toLocaleString()}</td>
                        </tr>
                        <tr>
                            <td class="border p-2 font-medium">商務艙</td>
                            <td class="border p-2 font-bold">${target.biz.toLocaleString()}</td>
                            <td class="border p-2 text-blue-600 font-bold">${(target.biz * pax).toLocaleString()}</td>
                            <td class="border p-2 text-emerald-600 font-bold">NT$ ${Math.round(target.biz * pax * valPerMile).toLocaleString()}</td>
                        </tr>
                    </tbody>
                </table>
                <p class="text-gray-400 text-[10px] text-center mt-2">基準價值以 1 哩 = 0.45 台幣試算</p>
            `;
        }

        // 貴賓室下拉選單連動
        function up_city() { 
            const cElem = document.getElementById('c'); 
            const ciElem = document.getElementById('ci'); 
            if(cElem && ciElem) {
                ciElem.innerHTML='<option value="">選擇城市</option>'+Object.keys(d.lounge[cElem.value]||{}).map(ci=>`<option value="${ci}">${ci}</option>`).join(''); 
            }
        }

        function up_air() { 
            const cElem = document.getElementById('c'); 
            const ciElem = document.getElementById('ci'); 
            const aElem = document.getElementById('a'); 
            if(cElem && ciElem && aElem) {
                aElem.innerHTML='<option value="">選擇機場</option>'+Object.keys(d.lounge[cElem.value]?.[ciElem.value]||{}).map(a=>`<option value="${a}">${a}</option>`).join(''); 
            }
        }

        function up_mem() { 
            const cElem = document.getElementById('c'); 
            const ciElem = document.getElementById('ci'); 
            const aElem = document.getElementById('a'); 
            const mElem = document.getElementById('m'); 
            if(cElem && ciElem && aElem && mElem) {
                mElem.innerHTML='<option value="">選擇會籍</option>'+Object.keys(d.lounge[cElem.value]?.[ciElem.value]?.[aElem.value]||{}).map(m=>`<option value="${m}">${m}</option>`).join(''); 
            }
        }

        function show() { 
            const cElem = document.getElementById('c'); 
            const ciElem = document.getElementById('ci'); 
            const aElem = document.getElementById('a'); 
            const mElem = document.getElementById('m'); 
            const rElem = document.getElementById('r'); 
            
            if(cElem && ciElem && aElem && mElem && rElem) { 
                const s = d.lounge[cElem.value]?.[ciElem.value]?.[aElem.value]?.[mElem.value]; 
                if (s && s.length > 0) {
                    rElem.innerHTML = `
                        <div class="bg-white p-5 rounded-2xl shadow mt-4">
                            <h3 class="font-bold text-lg">${s[0].name}</h3>
                            <p class="text-sm my-3 text-gray-600">${s[0].desc}</p>
                            <div class="flex flex-wrap gap-2">
                                ${s[0].img.map(url => `<img src="${url}" class="w-full sm:w-1/2 rounded-xl">`).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    rElem.innerHTML = `<div class="p-4 text-center text-gray-400">目前無貴賓室資料</div>`; 
                }
            } 
        }

        // AI 筆記功能
        function startVoiceInput() { 
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; 
            if (!SpeechRecognition) {
                alert("不支援語音");
                return;
            }
            const recognition = new SpeechRecognition(); 
            recognition.lang = 'zh-TW'; 
            recognition.onresult = e => {
                document.getElementById('noteInput').value = e.results[0][0].transcript; 
            }; 
            recognition.start(); 
        }
        
        async function sendNote() { 
            const text = document.getElementById('noteInput')?.value.trim(); 
            const msg = document.getElementById('resultMsg'); 
            const btn = document.getElementById('submitBtn'); 
            
            if (!text) {
                return alert('請輸入內容'); 
            }
            
            msg.innerText = "⏳ 處理中..."; 
            btn.disabled = true; 
            
            try { 
                const res = await fetch(scriptUrl, { 
                    method: "POST", 
                    body: JSON.stringify({ text, systemPrompt: currentSystemPrompt }) 
                }); 
                const result = await res.json(); 
                
                if (result.status === "success") {
                    msg.innerHTML = `<div class='p-4 bg-blue-50/70 rounded-xl border text-sm text-gray-800 shadow-sm'><b>${currentSkillName}：</b><br>${result.message.replace(/\n/g, '<br>')}</div>`;
                } else {
                    msg.innerText = `❌ 失敗：${result.message}`;
                }
            } catch (e) { 
                msg.innerText = "❌ 發生錯誤"; 
            } finally { 
                btn.disabled = false; 
            } 
        }
    </script>
</body>
</html>
