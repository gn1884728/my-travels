<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>生活優惠中心 - 完整完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto overflow-hidden">

    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex flex-col items-center gap-2">
        <div class="text-xl font-bold">生活優惠中心</div>
    </header>

    <main id="app" class="flex-1 p-4 overflow-y-auto pb-28"></main>

    <nav class="bg-white border-t flex justify-between p-3 shadow-lg fixed bottom-0 w-full max-w-md mx-auto z-50 text-[11px]">
        <button onclick="render('food', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-gift text-lg mb-1"></i>優惠</button>
        <button onclick="render('travel', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-plane-departure text-lg mb-1"></i>行程</button>
        <button onclick="render('lounge', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-couch text-lg mb-1"></i>貴賓室</button>
        <button onclick="render('cube_calc', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-credit-card text-lg mb-1"></i>CUBE</button>
        <button onclick="render('mileage', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-chart-line text-lg mb-1"></i>哩程</button>
        <button onclick="render('note', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6"><i class="fas fa-microphone-alt text-lg mb-1"></i>記事</button>
    </nav>

    <script>
        let d = { food: {}, travel: [], lounge: {} };
        let mileageData = { marriott: [] };
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwVLmSnHAsJ8DjU9ZJgp5ZZThsxbPHAtXIQ7R93O_nTd-Uz8WrkdpyFhVwwxvTEddXq/exec";

        /* --- 初始化資料載入 --- */
        async function init() {
            try {
                const [resData, resMileage] = await Promise.all([
                    fetch('data.json?t='+Date.now()).then(r => r.json()).catch(() => ({ food: {}, travel: [], lounge: {} })),
                    fetch('mileage_data.json?t='+Date.now()).then(r => r.json()).catch(() => ({ marriott: [] }))
                ]);
                d = resData;
                mileageData = resMileage;
                render('food');
            } catch(e) { console.error("資料載入錯誤", e); }
        }

        /* --- 核心渲染邏輯 --- */
        function render(tab, ev = null) {
            const app = document.getElementById('app');
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-blue-600', 'font-bold');
                btn.classList.add('text-gray-600');
            });
            if (ev) ev.currentTarget.classList.add('text-blue-600', 'font-bold');

            if(tab === 'food') {
                app.innerHTML = `<h2 class="text-xl font-bold mb-4">優惠資訊</h2><div id="food-list"></div>`;
                renderFoodList();
            } else if(tab === 'travel') {
                app.innerHTML = `<h2 class="text-xl font-bold mb-3">精選旅行行程</h2><div id="travel-list"></div>`;
                renderTravelList();
            } else if(tab === 'lounge') {
                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-3">貴賓室查詢</h2>
                    <select id="c" onchange="up_city()" class="w-full p-3 border rounded-xl mb-2"><option value="">選擇國家</option>${Object.keys(d.lounge).map(c => `<option value="${c}">${c}</option>`).join('')}</select>
                    <select id="ci" onchange="up_air()" class="w-full p-3 border rounded-xl mb-2"><option value="">選擇城市</option></select>
                    <select id="a" onchange="up_mem()" class="w-full p-3 border rounded-xl mb-2"><option value="">選擇機場</option></select>
                    <div id="r" class="mt-4"></div>`;
            } else if(tab === 'cube_calc') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow">
                        <h3 class="font-bold text-lg mb-3">CUBE 卡權益精算</h3>
                        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="🔍 輸入店名速查..." class="w-full p-3 border rounded-xl mb-3">
                        <div id="storeResult" class="p-3 bg-blue-50 rounded-xl mb-3 text-sm font-bold text-blue-800 hidden"></div>
                        <input type="number" id="consumeAmt" placeholder="消費金額" class="w-full p-3 border rounded-xl mb-2" oninput="calcPoints()">
                        <input type="number" id="consumeRate" placeholder="回饋率 (%)" class="w-full p-3 border rounded-xl mb-2" oninput="calcPoints()">
                        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4">預估小樹點：0 點</div>
                    </div>`;
            } else if(tab === 'mileage') {
                app.innerHTML = `<h2 class="text-xl font-bold mb-3">哩程與點數</h2><div id="mileage-list"></div>`;
                renderMileage();
            } else if(tab === 'note') {
                app.innerHTML = `<h2 class="text-xl font-bold mb-3">AI 智慧記事</h2>
                                 <textarea id="noteInput" class="w-full h-32 p-3 border rounded-xl mb-3"></textarea>
                                 <button onclick="sendNote()" class="bg-blue-600 text-white w-full p-3 rounded-xl font-bold">送出</button>
                                 <div id="resultMsg" class="mt-4 text-sm"></div>`;
            }
        }

        /* --- 各頁籤細部功能函式 --- */
        function renderFoodList() { /* 優惠邏輯 */ }
        function renderTravelList() { /* 行程邏輯 */ }
        function renderMileage() { /* 哩程列表 */ }
        function up_city() { /* 貴賓室連動 */ }
        function up_air() { /* 貴賓室連動 */ }
        function up_mem() { /* 貴賓室連動 */ }

        async function searchStore() {
            const val = document.getElementById('storeSearch').value.trim().toLowerCase();
            const resDiv = document.getElementById('storeResult');
            if (!val) { resDiv.classList.add('hidden'); return; }
            const response = await fetch('cube_config.json?t='+Date.now());
            const data = await response.json();
            let matched = null;
            if (data.plans) {
                for (const [planName, stores] of Object.entries(data.plans)) {
                    const found = stores.find(s => s.name.toLowerCase().includes(val));
                    if (found) { matched = { plan: planName, name: found.name, rate: found.rate }; break; }
                }
            }
            if (matched) {
                resDiv.classList.remove('hidden');
                resDiv.innerHTML = `通路：<b>${matched.name}</b><br>方案：<b>${matched.plan}</b> (${matched.rate*100}%)`;
                document.getElementById('consumeRate').value = matched.rate * 100;
                calcPoints();
            }
        }

        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0;
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            document.getElementById('pointResult').innerText = `預估小樹點：${Math.floor(amt * rate)} 點`;
        }

        async function sendNote() {
            const text = document.getElementById('noteInput').value;
            const res = await fetch(scriptUrl, { method: "POST", body: JSON.stringify({ text }) });
            document.getElementById('resultMsg').innerText = "✅ 已送出";
        }

        init();
    </script>
</body>
</html>
