<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 強制防快取機制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <title>生活優惠中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 加入 Markdown 解析器與樣式 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body h1, .markdown-body h2 { font-size: 1.1rem; font-weight: bold; margin-top: 1rem; margin-bottom: 0.5rem; color: #1e3a8a; }
        .markdown-body h3 { font-weight: bold; margin-top: 0.5rem; color: #374151; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body a { color: #2563eb; text-decoration: underline; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; margin-bottom: 1rem; font-size: 0.75rem; white-space: nowrap; }
        .markdown-body th { background-color: #f3f4f6; font-weight: bold; text-align: left; }
        .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto overflow-hidden">
    
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex flex-col items-center gap-2">
        <div class="text-xl font-bold">生活優惠中心</div>
        <div class="w-full max-w-xs text-xs font-normal text-gray-800">
            <select id="globalSkillSelect" onchange="loadSelectedSkill(this.value)" class="w-full p-2 rounded-lg border bg-white shadow-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="default">🌐 AI 模式：通用助手</option>
                <option value="japan-fireworks">🎆 AI 模式：日本花火節攻略助手</option>
                <option value="hotel-points">🏨 AI 模式：飯店點數房比價助手</option>
            </select>
        </div>
    </header>

    <main id="app" class="flex-1 p-4 overflow-y-auto pb-28"></main>

    <nav class="bg-white border-t flex justify-between p-3 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] fixed bottom-0 w-full max-w-md mx-auto z-50 text-[11px]">
        <button onclick="render('food', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-gift text-lg mb-1"></i>優惠
        </button>
        <button onclick="render('travel', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-plane-departure text-lg mb-1"></i>行程
        </button>
        <button onclick="render('lounge', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-couch text-lg mb-1"></i>貴賓室
        </button>
        <button onclick="render('cube_calc', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-credit-card text-lg mb-1"></i>CUBE
        </button>
        <button onclick="render('calc_mileage', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-calculator text-lg mb-1"></i>精算哩程
        </button>
        <button onclick="render('note', event)" class="flex flex-col items-center text-gray-600 hover:text-blue-600 w-1/6 transition-colors">
            <i class="fas fa-microphone-alt text-lg mb-1"></i>記事
        </button>
    </nav>

    <script>
        let d = { food: {}, travel: [], lounge: {} };
        let mileageData = { marriott: [] };
        
        let ex_twd = 32.50; 
        let ex_cny = 7.15; 
        let ex_jpy = 145.0;
        
        let currentSystemPrompt = ""; 
        let currentSkillName = "通用助手";
        const scriptUrl = "https://script.google.com/macros/s/AKfycbwVLmSnHAsJ8DjU9ZJgp5ZZThsxbPHAtXIQ7R93O_nTd-Uz8WrkdpyFhVwwxvTEddXq/exec";
        
        async function loadSelectedSkill(skillId) {
            if (skillId === 'default') { 
                currentSystemPrompt = ""; 
                currentSkillName = "通用助手"; 
                render('note'); 
                return; 
            }
            try { 
                const res = await fetch(`./skills/${skillId}.json?t=` + Date.now()); 
                const skillData = await res.json(); 
                currentSystemPrompt = skillData.systemPrompt || ""; 
                currentSkillName = skillData.name || skillId; 
                render('note'); 
            } catch (e) { 
                console.error("載入 Skill 失敗:", e); 
            }
        }

        Promise.all([
            fetch('data.json?t=' + Date.now()).then(r => r.json()).catch(() => ({ food: {}, travel: [], lounge: {} })),
            fetch('mileage_data.json?t=' + Date.now()).then(r => r.json()).catch(() => ({ marriott: [] })),
            fetch('https://api.exchangerate-api.com/v4/latest/USD').then(r => r.json()).catch(() => null)
        ]).then(([resData, resMileage, exData]) => {
            d = resData || { food: {}, travel: [], lounge: {} }; 
            mileageData = resMileage || { marriott: [] };
            
            if(exData && exData.rates) { 
                ex_twd = exData.rates.TWD; 
                ex_cny = exData.rates.CNY; 
                ex_jpy = exData.rates.JPY; 
            }
            render('calc_mileage'); 
        });

        function render(tab, ev = null) {
            const app = document.getElementById('app'); 
            if (!app) return;
            
            document.querySelectorAll('nav button').forEach(btn => { 
                btn.classList.remove('text-blue-600', 'font-bold'); 
                btn.classList.add('text-gray-600'); 
            });
            if (ev && ev.currentTarget) {
                ev.currentTarget.classList.add('text-blue-600', 'font-bold');
            }

            let month = new Date().getMonth() + 1;

            if (tab === 'food') {
                let options = Array.from({length: 12}, (_, i) => `<option value="${i+1}" ${i+1 === month ? 'selected' : ''}>${i+1}月份</option>`).join('');
                app.innerHTML = `
                    <div class="flex gap-2 mb-4">
                        <button onclick="render('food')" class="food-tab-btn flex-1 bg-blue-600 text-white p-2.5 rounded-xl font-bold text-sm shadow">🗓️ 本月優惠</button>
                        <button onclick="loadDeliveryCoupons()" class="food-tab-btn flex-1 bg-emerald-50 text-emerald-700 p-2.5 rounded-xl font-bold text-sm shadow border border-emerald-100">🛵 外送/信用卡即時碼</button>
                    </div>
                    <div id="food-dynamic-content">
                        <select onchange="renderFoodMonth(this.value)" class="w-full p-3 mb-4 rounded-xl border font-bold bg-white shadow-sm">${options}</select>
                        <div id="food-list"></div>
                    </div>`;
                renderFoodMonth(month);
            } 
            else if (tab === 'travel') {
                const fireworksTravelList = [
                    { title: "長岡祭大花火大會", tag: "🎆 日本三大花火", tagColor: "bg-rose-500", date: "2027/08/02 - 08/03", location: "新潟縣長岡市信濃川", airport: "成田 (NRT) / 羽田 (HND) / 新潟 (KIJ)", url: "https://nagaokamatsuri.com/", calUrl: "https://www.google.com/calendar/render?action=TEMPLATE&text=長岡祭大花火大會&dates=20270802T112000Z/20270803T131000Z&location=新潟縣長岡市" }, 
                    { title: "洞爺湖花火大會", tag: "🎆 北海道溫泉花火", tagColor: "bg-amber-500", date: "2027/02月上旬 (冬) ｜ 4/28-10/31 (長跑)", location: "北海道洞爺湖溫泉湖畔", airport: "新千歲機場 (CTS)", url: "https://www.laketoya.com/event/fireworks/", calUrl: "https://www.google.com/calendar/render?action=TEMPLATE&text=洞爺湖花火大會&location=洞爺湖溫泉" }
                ];
                let fireworksCardsHtml = fireworksTravelList.map(item => `
                    <div class="bg-white p-5 rounded-2xl shadow mb-4 border-l-4 border-blue-500">
                        <div class="flex justify-between items-center mb-2">
                            <span class="${item.tagColor} text-white px-3 py-1 rounded-full text-xs font-bold">${item.tag}</span>
                            <span class="text-xs text-gray-500 font-bold">${item.location}</span>
                        </div>
                        <h3 class="font-bold text-lg my-1 text-gray-800">${item.title}</h3>
                        <p class="text-gray-600 text-xs my-1"><b>日期：</b>${item.date}</p>
                        <p class="text-gray-600 text-xs mb-3"><b>建議機場：</b>${item.airport}</p>
                        <div class="flex gap-2">
                            <a href="${item.url}" target="_blank" class="bg-blue-600 text-white p-2.5 rounded-xl flex-1 text-center font-bold text-xs shadow">查看官方攻略</a>
                            <a href="${item.calUrl}" target="_blank" class="bg-gray-100 p-2.5 rounded-xl text-xs font-bold text-gray-700">+ 日曆</a>
                        </div>
                    </div>`).join('');
                
                let userTravelHtml = (d.travel || []).filter(i => !i.title.includes('韓國') && !i.title.includes('7月')).map(i => `
                    <a href="${i.url}" target="_blank" class="block bg-white p-5 rounded-2xl shadow mb-4 font-bold text-lg text-blue-700">
                        <i class="fas fa-plane mr-2"></i>${i.title}
                    </a>`).join('');
                
                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-3 text-center text-gray-800"><i class="fas fa-plane-departure text-blue-600 mr-2"></i>精選花火與旅行行程</h2>
                    <div class="mb-4">${fireworksCardsHtml}</div>
                    <h3 class="font-bold text-base my-3 text-gray-700 border-b pb-2">常用旅行連結</h3>
                    <div>${userTravelHtml}</div>`;
            } 
            else if (tab === 'lounge') {
                let countryOptions = (d.lounge ? Object.keys(d.lounge) : []).map(c => `<option value="${c}">${c}</option>`).join('');
                app.innerHTML = `
                    <h2 class="text-xl font-bold mb-4 text-center text-gray-800">貴賓室查詢</h2>
                    <select id="c" onchange="up_city()" class="w-full p-4 border rounded-xl mb-3 font-bold bg-white">
                        <option value="">選擇國家</option>
                        ${countryOptions}
                    </select>
                    <select id="ci" onchange="up_air()" class="w-full p-4 border rounded-xl mb-3 bg-white">
                        <option value="">選擇城市</option>
                    </select>
                    <select id="a" onchange="up_mem()" class="w-full p-4 border rounded-xl mb-3 bg-white">
                        <option value="">選擇機場</option>
                    </select>
                    <select id="m" onchange="show()" class="w-full p-4 border rounded-xl mb-3 bg-white">
                        <option value="">選擇會籍</option>
                    </select>
                    <div id="r" class="mt-4"></div>`;
            } 
            else if (tab === 'cube_calc') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-10">
                        <h3 class="font-bold text-lg mb-3 text-center">CUBE 卡權益精算</h3>
                        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="🔍 輸入店名速查..." class="w-full p-3 border rounded-xl mb-3 bg-gray-50 text-sm">
                        <div id="storeResult" class="p-3 bg-blue-50 rounded-xl mb-4 text-sm font-bold text-blue-800 hidden"></div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <label class="block text-gray-500 text-xs mb-1 font-bold">消費金額</label>
                                <input type="number" id="consumeAmt" placeholder="金額" class="w-full p-3 border rounded-xl text-sm" oninput="calcPoints()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-xs mb-1 font-bold">回饋率 (%)</label>
                                <input type="number" id="consumeRate" placeholder="回饋率" class="w-full p-3 border rounded-xl text-sm" oninput="calcPoints()">
                            </div>
                        </div>
                        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-gray-50 rounded-xl">預估小樹點：0 點</div>
                    </div>`;
            } 
            else if (tab === 'calc_mileage') {
                app.innerHTML = `
                    <!-- 萬豪精算區塊 -->
                    <div class="bg-white p-5 rounded-2xl shadow mb-6">
                        <h3 class="font-bold text-lg mb-4 text-center text-blue-700"><i class="fas fa-calculator mr-2"></i>萬豪住房點數專業精算</h3>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">結帳幣別</label>
                                <select id="calc_currency" onchange="updateCurrencyRate('calc')" class="w-full p-2.5 border rounded-xl bg-blue-50 text-blue-800 font-bold">
                                    <option value="CNY">人民幣 (CNY)</option>
                                    <option value="USD">美元 (USD)</option>
                                    <option value="TWD" selected>台幣 (TWD)</option>
                                    <option value="JPY">日幣 (JPY)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">兌美金匯率</label>
                                <input type="number" id="calc_rate" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm text-gray-400" oninput="drawProCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">計分單晚房費</label>
                                <input type="number" id="calc_night_price" value="6000" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">稅費扣除 (隨幣別鎖定)</label>
                                <select id="calc_tax" onchange="drawProCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-xs"></select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">晚數</label>
                                <input type="number" id="calc_nights" value="2" min="1" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                            <div>
                                <label class="block text-emerald-600 text-[11px] mb-1 font-bold">實際總支付 (同幣別)</label>
                                <input type="number" id="calc_actual_paid" placeholder="若無折扣免填" class="w-full p-2.5 border rounded-xl bg-emerald-50 text-emerald-800 border-emerald-200 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">萬豪會籍</label>
                                <select id="calc_tier" onchange="drawProCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium">
                                    <option value="0">白板會員 (0%)</option>
                                    <option value="0.1">銀卡 (+10%)</option>
                                    <option value="0.25">金卡 (+25%)</option>
                                    <option value="0.5">白金卡 (+50%)</option>
                                    <option value="0.75" selected>鈦金/大使 (+75%)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">迎賓禮</label>
                                <input type="number" id="calc_welcome_gift" value="1000" class="w-full p-2.5 border rounded-xl bg-gray-50 font-medium text-sm" oninput="drawProCalc()">
                            </div>
                        </div>
                        <div class="mb-4 text-sm">
                            <label class="block text-rose-600 text-[11px] mb-1 font-bold">當季檔期活動</label>
                            <select id="calc_promo" onchange="drawProCalc()" class="w-full p-2.5 border rounded-xl bg-rose-50 text-rose-800 font-bold border-rose-200">
                                <option value="q3_1500" selected>🔥 2026 Q3活動：每連住 2 晚加贈 1,500 點</option>
                                <option value="0">無加贈活動</option>
                            </select>
                        </div>
                        <div id="calc_table_result" class="mt-4"></div>
                    </div>

                    <!-- IHG 精算區塊 -->
                    <div class="bg-white p-5 rounded-2xl shadow mb-8">
                        <h3 class="font-bold text-lg mb-4 text-center text-orange-600">IHG 積分 vs 長榮哩程 精算</h3>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">結帳幣別</label>
                                <select id="ihg_calc_currency" onchange="updateCurrencyRate('ihg_calc')" class="w-full p-2.5 border rounded-xl bg-orange-50 font-bold">
                                    <option value="CNY">人民幣 (CNY)</option>
                                    <option value="USD">美元 (USD)</option>
                                    <option value="TWD" selected>台幣 (TWD)</option>
                                    <option value="JPY">日幣 (JPY)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">兌美金匯率</label>
                                <input type="number" id="ihg_calc_rate" class="w-full p-2.5 border rounded-xl bg-gray-50 text-gray-400" oninput="drawIhgCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">計分單晚房費</label>
                                <input type="number" id="ihg_calc_night_price" value="3000" class="w-full p-2.5 border rounded-xl bg-gray-50" oninput="drawIhgCalc()">
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">稅費扣除 (隨幣別鎖定)</label>
                                <select id="ihg_calc_tax" onchange="drawIhgCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50 text-xs"></select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">晚數</label>
                                <input type="number" id="ihg_calc_nights" value="1" min="1" class="w-full p-2.5 border rounded-xl bg-gray-50" oninput="drawIhgCalc()">
                            </div>
                            <div>
                                <label class="block text-emerald-600 text-[11px] mb-1 font-bold">實際總支付 (同幣別)</label>
                                <input type="number" id="ihg_calc_actual_paid" placeholder="若無折扣免填" class="w-full p-2.5 border rounded-xl bg-emerald-50 text-emerald-800 border-emerald-200" oninput="drawIhgCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">每晚加贈活動</label>
                                <select id="ihg_calc_per_night_bonus" onchange="drawIhgCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50">
                                    <option value="0">無</option>
                                    <option value="4n8k">4N8K</option>
                                    <option value="2n2k">2N2K</option>
                                    <option value="double">雙倍積分</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">迎賓禮 (固定拿點數)</label>
                                <input type="number" id="ihg_calc_welcome_gift" value="600" class="w-full p-2.5 border rounded-xl bg-gray-50" oninput="drawIhgCalc()">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
                            <div>
                                <label class="block text-gray-500 text-[11px] mb-1 font-bold">IHG 會籍</label>
                                <select id="ihg_calc_tier" onchange="drawIhgCalc()" class="w-full p-2.5 border rounded-xl bg-gray-50">
                                    <option value="0">俱樂部 (0%)</option>
                                    <option value="0.2">銀卡 (+20%)</option>
                                    <option value="0.4">金卡 (+40%)</option>
                                    <option value="0.6">白金卡 (+60%)</option>
                                    <option value="1.0" selected>鑽石卡 (+100%)</option>
                                </select>
                            </div>
                        </div>
                        <div id="ihg_calc_table_result" class="mt-4"></div>
                    </div>
                `;
                
                // 初次渲染時呼叫 updateCurrencyRate 來自動綁定並建立稅金選單
                updateCurrencyRate('calc'); 
                updateCurrencyRate('ihg_calc');
            } 
            else if (tab === 'note') {
                app.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-10">
                        <h3 class="font-bold text-lg text-gray-800 mb-3">AI 智慧隨手記事</h3>
                        <textarea id="noteInput" placeholder="請輸入行程/記事..." class="w-full h-32 p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-3 bg-gray-50"></textarea>
                        <div class="flex gap-2">
                            <button onclick="startVoiceInput()" class="bg-emerald-600 text-white p-3 rounded-xl flex-1 font-bold text-sm shadow">語音輸入</button>
                            <button onclick="sendNote()" id="submitBtn" class="bg-blue-600 text-white p-3 rounded-xl flex-1 font-bold text-sm shadow">送出並整理</button>
                        </div>
                        <div id="resultMsg" class="mt-4 text-sm text-gray-600"></div>
                    </div>`;
            }
        }

        async function loadDeliveryCoupons() {
            const container = document.getElementById('food-dynamic-content'); 
            if (!container) return;
            
            container.innerHTML = '<div class="text-center text-gray-500 py-10"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br>正在攔截最新外送與信用卡優惠...</div>';
            try {
                // 直接攔截 GitHub 開源專案的最新 Markdown 原始檔
                const res = await fetch('https://raw.githubusercontent.com/ridemountainpig/tasty-coupon/main/README.md');
                if (!res.ok) throw new Error('攔截失敗');
                const mdText = await res.text();
                
                // 透過 marked.js 將 Markdown 轉換為漂亮的 HTML
                const htmlContent = marked.parse(mdText);
                
                container.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow mb-4 text-sm text-gray-800 markdown-body overflow-x-auto">
                        ${htmlContent}
                    </div>`;
            } catch(e) { 
                container.innerHTML = '<div class="text-center text-rose-500 py-10 font-bold">無法連線至 GitHub 解析檔案，請稍後再試。</div>'; 
            }
        }

        // 自動綁定匯率與稅金下拉選單
        function updateCurrencyRate(calcPrefix) {
            const currency = document.getElementById(calcPrefix + '_currency').value; 
            const rateInput = document.getElementById(calcPrefix + '_rate');
            const taxSelect = document.getElementById(calcPrefix + '_tax');
            
            if (currency === 'CNY') {
                rateInput.value = ex_cny.toFixed(2); 
            } else if (currency === 'TWD') {
                rateInput.value = ex_twd.toFixed(2); 
            } else if (currency === 'JPY') {
                rateInput.value = ex_jpy.toFixed(2); 
            } else if (currency === 'USD') {
                rateInput.value = (1.00).toFixed(2);
            }
            
            // 幣別與稅金防呆綁定邏輯
            if (taxSelect) {
                const currentTax = taxSelect.value;
                let opts = `<option value="1">已是淨價 (不扣除)</option>`;
                
                if (currency === 'TWD') {
                    opts += `<option value="1.155">扣除 15.5% (台灣常態)</option>`;
                } else if (currency === 'CNY') {
                    opts += `<option value="1.166">扣除 16.6% (中國常態)</option>`;
                } else if (currency === 'JPY') {
                    opts += `<option value="1.21">扣除 21% (日本常態)</option>`;
                } else {
                    opts += `<option value="1.155">扣除 15.5% (台灣常態)</option>
                             <option value="1.166">扣除 16.6% (中國常態)</option>
                             <option value="1.21">扣除 21% (日本常態)</option>`;
                }
                
                taxSelect.innerHTML = opts;
                
                // 若使用者之前選擇了淨價，維持淨價；否則根據幣別自動鎖定預設稅金
                if (currentTax === "1") {
                    taxSelect.value = "1";
                } else {
                    if (currency === 'TWD') taxSelect.value = "1.155";
                    else if (currency === 'CNY') taxSelect.value = "1.166";
                    else if (currency === 'JPY') taxSelect.value = "1.21";
                    else taxSelect.value = "1";
                }
            }
            
            if (calcPrefix === 'calc') drawProCalc(); 
            if (calcPrefix === 'ihg_calc') drawIhgCalc();
        }

        const customCubeData = [
            { name: "台中老井燒肉", plan: "趣旅行", rate: 0.03 }, 
            { name: "八方雲集", plan: "樂饗購", rate: 0.03 }, 
            { name: "支付寶", plan: "玩數位", rate: 0.03 }, 
            { name: "摩斯漢堡", plan: "樂饗購", rate: 0.03 }, 
            { name: "必勝客", plan: "樂饗購", rate: 0.03 }, 
            { name: "拿坡里", plan: "樂饗購", rate: 0.03 }, 
            { name: "品田牧場(家樂福中原店)", plan: "樂饗購", rate: 0.03 }, 
            { name: "Mr.May義式百匯", plan: "樂饗購", rate: 0.03 }
        ];

        function fuzzyMatch(p, s) { 
            let pI = 0, sI = 0; 
            p = p.replace(/\s+/g, '').toLowerCase(); 
            s = s.replace(/\s+/g, '').toLowerCase(); 
            while (pI < p.length && sI < s.length) { 
                if (p[pI] === s[sI]) pI++; 
                sI++; 
            } 
            return pI === p.length; 
        }

        async function searchStore() {
            const val = document.getElementById('storeSearch').value.trim(); 
            const resDiv = document.getElementById('storeResult');
            
            if (!val) { 
                resDiv.classList.add('hidden'); 
                return; 
            }
            let matchedList = customCubeData.filter(item => fuzzyMatch(val, item.name));
            if (matchedList.length > 0) {
                resDiv.classList.remove('hidden'); 
                resDiv.innerHTML = `找到 ${matchedList.length} 個適用方案：<br>` + matchedList.map(m => `&bull; <b>${m.name}</b> ➔ <b>${m.plan}</b> (${m.rate*100}%)<br>`).join('');
                document.getElementById('consumeRate').value = matchedList[0].rate * 100; 
                calcPoints();
            } else { 
                resDiv.classList.remove('hidden'); 
                resDiv.innerHTML = `未找到符合通路，請手 manual手動確認`; 
            }
        }

        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0; 
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            document.getElementById('pointResult').innerText = `預估小樹點：${Math.round(amt * rate)} 點`;
        }

        // 萬豪精算邏輯
        function drawProCalc() {
            const container = document.getElementById('calc_table_result'); 
            if (!container) return;
            
            const currency = document.getElementById('calc_currency').value;
            const rate = parseFloat(document.getElementById('calc_rate').value) || 1;
            const nightPrice = parseFloat(document.getElementById('calc_night_price').value) || 0;
            const nights = parseInt(document.getElementById('calc_nights').value) || 1;
            const taxDivisor = parseFloat(document.getElementById('calc_tax').value) || 1;
            const welcomeGift = parseFloat(document.getElementById('calc_welcome_gift').value) || 0;
            const tierBonusRate = parseFloat(document.getElementById('calc_tier').value) || 0;
            const promoType = document.getElementById('calc_promo')?.value || '0';
            
            const actualPaidInput = document.getElementById('calc_actual_paid').value;
            const actualPaid = actualPaidInput !== "" ? parseFloat(actualPaidInput) : (nightPrice * nights);
            
            const qualifySpendPerNight = nightPrice / taxDivisor;
            const totalQualifySpend = qualifySpendPerNight * nights;
            let spendUSD = currency !== 'USD' ? totalQualifySpend / rate : totalQualifySpend;
            let actualPaidUSD = currency !== 'USD' ? actualPaid / rate : actualPaid;
            let totalCostNTD = Math.round(actualPaidUSD * ex_twd);
            
            const basePoints = Math.round(spendUSD * 10);
            const tierPoints = Math.round(basePoints * tierBonusRate);
            
            let promoPoints = 0;
            if (promoType === 'q3_1500') {
                promoPoints = Math.floor(nights / 2) * 1500;
            }
            
            const scenarios = [
                { name: "無活動<br>(基本+會籍)", pts: basePoints + tierPoints + welcomeGift, promo: 0 }
            ];
            
            if (promoType === 'q3_1500' && promoPoints > 0) {
                scenarios.push({ 
                    name: "🔥 疊加 Q3<br>每2晚加贈", 
                    pts: basePoints + tierPoints + welcomeGift + promoPoints, 
                    promo: promoPoints 
                });
            }
            
            let tableRows = scenarios.map(s => {
                const totalValueNTD = Math.round(s.pts * 0.23);
                const netRoomCost = totalCostNTD - totalValueNTD;
                const netColor = netRoomCost <= 0 ? "text-emerald-600" : "text-gray-800";
                const netText = netRoomCost <= 0 ? `倒賺 NT$ ${Math.abs(netRoomCost).toLocaleString()}` : `NT$ ${netRoomCost.toLocaleString()}`;
                const promoHtml = s.promo > 0 ? `<div class="text-[11px] text-rose-500 font-bold mt-1 bg-rose-50 p-1 rounded">🔥 Q3加贈 +${s.promo.toLocaleString()}</div>` : '';

                return `
                    <tr class="border-b">
                        <td class="p-2 font-medium leading-tight">${s.name}</td>
                        <td class="p-2 font-bold text-gray-800">
                            ${s.pts.toLocaleString()} 點
                            <div class="text-[10px] text-gray-500 font-normal">價值 NT$ ${totalValueNTD.toLocaleString()}</div>
                            ${promoHtml}
                        </td>
                        <td class="p-2 ${netColor} font-bold bg-emerald-50/30">${netText}</td>
                    </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="text-sm font-bold text-gray-700 mb-2 bg-blue-50 border border-blue-100 p-2.5 rounded-lg text-center shadow-sm">
                    💰 本次實際總支出：<span class="text-blue-700">NT$ ${totalCostNTD.toLocaleString()}</span>
                </div>
                <table class="w-full border-collapse border border-gray-200 text-center bg-white shadow-sm rounded-xl overflow-hidden text-xs">
                    <thead class="bg-blue-50 text-blue-700 font-bold">
                        <tr>
                            <th class="border p-2 w-1/3">方案</th>
                            <th class="border p-2 w-1/3">總獲取積分</th>
                            <th class="border p-2 w-1/3">回血後淨房費</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>`;
        }

        // IHG 精算邏輯 (加入倒賺顯示)
        function drawIhgCalc() {
            const container = document.getElementById('ihg_calc_table_result'); 
            if (!container) return;
            
            const currency = document.getElementById('ihg_calc_currency').value; 
            const rate = parseFloat(document.getElementById('ihg_calc_rate').value) || 1;
            const nightPrice = parseFloat(document.getElementById('ihg_calc_night_price').value) || 0; 
            const nights = parseInt(document.getElementById('ihg_calc_nights').value) || 1;
            const taxDivisor = parseFloat(document.getElementById('ihg_calc_tax').value) || 1; 
            const promoType = document.getElementById('ihg_calc_per_night_bonus').value;
            const welcomeGift = parseFloat(document.getElementById('ihg_calc_welcome_gift').value) || 0; 
            const tierBonusRate = parseFloat(document.getElementById('ihg_calc_tier').value) || 0;
            const actualPaidInput = document.getElementById('ihg_calc_actual_paid').value; 
            const actualPaid = actualPaidInput !== "" ? parseFloat(actualPaidInput) : (nightPrice * nights);
            
            const qualifySpendPerNight = nightPrice / taxDivisor; 
            const totalQualifySpend = qualifySpendPerNight * nights;
            let spendUSD = currency !== 'USD' ? totalQualifySpend / rate : totalQualifySpend; 
            let actualPaidUSD = currency !== 'USD' ? actualPaid / rate : actualPaid;
            let totalCostNTD = Math.round(actualPaidUSD * ex_twd);
            
            const basePoints = Math.round(spendUSD * 10); 
            const tierPoints = Math.round(basePoints * tierBonusRate);
            
            let promoBonus = promoType === '4n8k' ? nights * 2000 : promoType === '2n2k' ? nights * 1000 : promoType === 'double' ? basePoints : 0;
            
            const scenarios = [{ name: "基本累積", pts: basePoints + tierPoints + welcomeGift, promo: 0 }];
            if (promoType !== '0') {
                scenarios.push({ name: "疊加活動加贈", pts: basePoints + tierPoints + welcomeGift + promoBonus, promo: promoBonus });
            }
            
            let tableRows = scenarios.map(s => {
                const pointValueNTD = Math.round(s.pts * 0.15); 
                const pointNetRoomCost = totalCostNTD - pointValueNTD; 
                
                const evaExtraPts = welcomeGift + s.promo; 
                const evaExtraValueNTD = Math.round(evaExtraPts * 0.15);
                const totalEvaValueNTD = 225 + evaExtraValueNTD;
                const evaNetRoomCost = totalCostNTD - totalEvaValueNTD;
                
                let evaDisplay = `500哩<br><span class="text-[10px] text-gray-500">(NT$ 225)</span>`;
                if (evaExtraPts > 0) {
                    evaDisplay = `500哩<br><span class="text-rose-500">+${evaExtraPts.toLocaleString()}點</span><br><span class="text-[10px] text-gray-500">(總值 NT$ ${totalEvaValueNTD.toLocaleString()})</span>`;
                }

                // 判斷是否顯示倒賺
                const pointNetText = pointNetRoomCost <= 0 ? `倒賺 NT$ ${Math.abs(pointNetRoomCost).toLocaleString()}` : `NT$ ${pointNetRoomCost.toLocaleString()}`;
                const evaNetText = evaNetRoomCost <= 0 ? `倒賺 NT$ ${Math.abs(evaNetRoomCost).toLocaleString()}` : `NT$ ${evaNetRoomCost.toLocaleString()}`;
                
                return `
                    <tr class="border-b">
                        <td class="p-2 font-medium leading-tight">${s.name}</td>
                        <td class="p-2 font-bold">
                            ${s.pts.toLocaleString()}
                            <div class="text-[10px] text-gray-500 font-normal">NT$ ${pointValueNTD.toLocaleString()}</div>
                        </td>
                        <td class="p-2 font-bold leading-tight">
                            ${evaDisplay}
                        </td>
                        <td class="p-2 text-left pl-3 bg-orange-50/20 text-[11px] font-bold">
                            <div class="${pointNetRoomCost <= 0 ? 'text-emerald-600' : 'text-gray-800'}">積: ${pointNetText}</div>
                            <div class="mt-1 ${evaNetRoomCost <= 0 ? 'text-emerald-600' : 'text-gray-800'}">哩: ${evaNetText}</div>
                        </td>
                    </tr>`;
            }).join('');
            
            container.innerHTML = `
                <table class="w-full border-collapse border border-gray-200 text-center bg-white shadow-sm rounded-xl overflow-hidden text-xs">
                    <thead class="bg-orange-50 text-orange-700 font-bold">
                        <tr>
                            <th class="border p-2 w-[22%]">方案</th>
                            <th class="border p-2 w-[22%]">純拿積分</th>
                            <th class="border p-2 w-[26%]">拿長榮哩程</th>
                            <th class="border p-2 w-[30%]">淨房費比較</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>`;
        }

                        <p class="text-sm text-gray-600"><b>攜伴：</b>${info.guest}</p>
                    </div>`;
            } else { 
                r.innerHTML = ''; 
            }
        }
    </script>
