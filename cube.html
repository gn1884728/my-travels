<!-- ======================================================= -->
<!-- CUBE 卡權益精算 (請整包替換您原本的白色卡片區塊) -->
<!-- ======================================================= -->
<div class="bg-white p-6 rounded-[24px] shadow-sm mb-6 relative">
    
    <h2 class="text-xl font-bold mb-6 text-center text-black">CUBE 卡權益精算</h2>

    <!-- 🔍 搜尋店名 -->
    <div class="mb-5 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="輸入店名速查..." class="w-full pl-9 pr-4 py-3 border border-gray-100 rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-600 transition-colors">
    </div>
    
    <!-- 搜尋結果顯示區 (預設隱藏) -->
    <div id="storeResult" class="p-4 bg-blue-50 rounded-xl mb-5 text-sm font-bold text-blue-800 hidden border border-blue-100"></div>
    
    <!-- 💰 消費金額與回饋率 -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
            <label class="block text-gray-500 text-xs mb-2 font-bold">消費金額</label>
            <input type="number" id="consumeAmt" placeholder="金額" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-700 shadow-sm" oninput="calcPoints()">
        </div>
        <div>
            <label class="block text-gray-500 text-xs mb-2 font-bold">回饋率 (%)</label>
            <input type="number" id="consumeRate" placeholder="回饋率" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-700 shadow-sm" oninput="calcPoints()">
        </div>
    </div>
    
    <!-- 🌟 小樹點試算結果 -->
    <div id="pointResult" class="text-center text-xl font-bold text-[#e11d48] py-4 bg-gray-50 rounded-xl mb-6 tracking-wide">
        預估小樹點：0 點
    </div>

    <!-- 🚀 查無特店回報區塊 (完美融入您的介面) -->
    <div class="border-t border-gray-100 pt-5 mt-2">
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-xl border border-blue-100 flex items-center justify-between">
            <div>
                <h4 class="text-sm font-bold text-blue-800 mb-1">查無特店？歡迎回報 🚀</h4>
                <p class="text-xs text-gray-500">提供截圖，一起擴大資料庫</p>
            </div>
            <a href="https://forms.gle/xLTZqzGPGXib2zYj6" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-sm transition-colors whitespace-nowrap">
                提供截圖
            </a>
        </div>
    </div>
</div>

<!-- ======================================================= -->
<!-- CUBE 卡精算邏輯 (請確保這段 Script 放在 HTML 底部或卡片下方) -->
<!-- ======================================================= -->
<script>
    let customCubeData = [];

    // 自動讀取 APP 目錄下的 cube_config.json
    fetch('cube_config.json')
        .then(response => response.json())
        .then(data => {
            for (const plan in data.plans) {
                data.plans[plan].forEach(store => {
                    customCubeData.push({
                        name: store.name,
                        plan: plan,
                        rate: store.rate
                    });
                });
            }
        })
        .catch(error => console.error('無法載入資料庫:', error));

    function fuzzyMatch(p, s) { 
        let pI = 0, sI = 0; 
        p = p.replace(/\s+/g, '').toLowerCase(); 
        s = s.replace(/\s+/g, '').toLowerCase(); 
        while (pI < p.length && sI < s.length) { 
            if (p[pI] === s[sI]) pI++; 
            sI++; 
        } 
        return pI === p.length; 
    }

    function searchStore() {
        const val = document.getElementById('storeSearch').value.trim(); 
        const resDiv = document.getElementById('storeResult');
        
        if (!val || customCubeData.length === 0) { 
            resDiv.classList.add('hidden'); 
            return; 
        }
        let matchedList = customCubeData.filter(item => fuzzyMatch(val, item.name));
        if (matchedList.length > 0) {
            resDiv.classList.remove('hidden'); 
            resDiv.innerHTML = `✅ 找到 ${matchedList.length} 個適用方案：<br><br>` + 
                               matchedList.map(m => `&bull; <b>${m.name}</b> ➔ 建議切換 <b>【${m.plan}】</b> (${Math.round(m.rate*100)}%)<br>`).join('');
            document.getElementById('consumeRate').value = Math.round(matchedList[0].rate * 100); 
            calcPoints();
        } else { 
            resDiv.classList.remove('hidden'); 
            resDiv.innerHTML = `⚠️ 未找到符合通路，請手動輸入回饋率，或協助回報。`; 
        }
    }

    function calcPoints() {
        const amt = parseFloat(document.getElementById('consumeAmt').value) || 0; 
        const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
        document.getElementById('pointResult').innerText = `預估小樹點：${Math.round(amt * rate)} 點`;
    }
</script>
<!-- ======================================================= -->
<!-- 整包結束 -->
