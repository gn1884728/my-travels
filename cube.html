<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 防快取機制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CUBE 卡權益速查精算</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans max-w-md mx-auto">
    <!-- 頂部 Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 text-center">
        <div class="text-xl font-bold">💳 國泰 CUBE 卡速查小幫手</div>
    </header>

    <!-- 主畫面內容區 -->
    <main class="flex-1 p-4 overflow-y-auto">
        <div class="bg-white p-5 rounded-2xl shadow mt-2">
            <h3 class="font-bold text-lg mb-3 text-gray-800 text-center">通路查詢與點數試算</h3>
            
            <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs mb-4">
                <b>💡 童樂匯解鎖提醒：</b>需「親子與未成年子女皆持有本行帳戶」且「持有有效 CUBE 正卡」始可切換！
            </div>

            <!-- 搜尋框 -->
            <div class="relative mb-3">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i class="fas fa-search text-gray-400"></i>
                </div>
                <input type="text" id="storeSearch" oninput="searchStore()" placeholder="輸入店名速查 (例: 7-11)..." class="w-full p-3 pl-10 border rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- 搜尋結果顯示區 -->
            <div id="storeResult" class="p-3 bg-blue-50 rounded-xl mb-4 text-sm font-bold text-blue-800 hidden leading-relaxed"></div>

            <!-- 試算區 -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-gray-500 text-xs mb-1 font-bold">消費金額</label>
                    <input type="number" id="consumeAmt" placeholder="請輸入金額" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400" oninput="calcPoints()">
                </div>
                <div>
                    <label class="block text-gray-500 text-xs mb-1 font-bold">回饋率 (%)</label>
                    <input type="number" id="consumeRate" placeholder="帶入回饋率" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400" oninput="calcPoints()">
                </div>
            </div>

            <!-- 結果顯示 -->
            <div id="pointResult" class="text-center text-2xl font-bold text-rose-600 py-5 bg-rose-50 border border-rose-100 rounded-xl">
                預估小樹點：0 點
            </div>
        </div>
    </main>

    <script>
        // CUBE 搜尋：支援多方案同時顯示，讀取同一個 cube_config.json
        async function searchStore() {
            const val = document.getElementById('storeSearch').value.trim().toLowerCase();
            const resDiv = document.getElementById('storeResult');
            if (!val) { 
                resDiv.classList.add('hidden'); 
                return; 
            }
            try {
                // 從同一個資料夾讀取設定檔
                const response = await fetch('cube_config.json?t=' + Date.now());
                const data = await response.json();
                let matchedList = [];
                
                if (data.plans) {
                    for (const [planName, stores] of Object.entries(data.plans)) {
                        const found = stores.find(s => s.name.toLowerCase().includes(val));
                        if (found) {
                            matchedList.push({ plan: planName, name: found.name, rate: found.rate });
                        }
                    }
                }

                if (matchedList.length > 0) {
                    resDiv.classList.remove('hidden');
                    let html = `找到 ${matchedList.length} 個適用方案：<br>`;
                    matchedList.forEach(m => {
                        html += `&bull; <b>${m.name}</b> ➔ 切換至：<b>${m.plan}</b> (${m.rate * 100}%)<br>`;
                    });
                    resDiv.innerHTML = html;
                    
                    // 自動帶入第一個找到的回饋率
                    document.getElementById('consumeRate').value = matchedList[0].rate * 100;
                    calcPoints();
                } else {
                    resDiv.classList.remove('hidden');
                    resDiv.innerHTML = `<span class="text-gray-500">未找到符合通路，請手動確認。</span>`;
                }
            } catch(e) { 
                console.error("搜尋錯誤:", e); 
                resDiv.innerHTML = "資料載入發生錯誤";
                resDiv.classList.remove('hidden');
            }
        }

        // 四捨五入算點數
        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0;
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            const points = Math.round(amt * rate);
            document.getElementById('pointResult').innerText = `預估小樹點：${points} 點`;
        }
    </script>
</body>
</html>
